<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe Studio</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #3b5bdb; --ok: #2f9e44; --warn: #e8890c; --fail: #e03131; --track: #ececE7;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ececE7; --muted: #9a9a93; --line: #2e2e2b;
      --accent: #748ffc; --ok: #51cf66; --warn: #ffa94d; --fail: #ff6b6b; --track: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  header .meta { color: var(--muted); font-size: 12px; }
  header select.proj { font-weight: 600; max-width: 240px; padding: 3px 6px; }
  header .spacer { flex: 1; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
  nav button.active { background: var(--track); color: var(--text); font-weight: 600; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: var(--track); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.stop { background: var(--fail); padding: 3px 12px; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  form.acct { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 16px; }
  form.acct label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  form.acct input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; min-width: 0; }
  input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; min-width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--panel); border: 0; padding: 6px 12px; color: var(--muted); cursor: pointer; font: inherit; }
  .seg button.active { background: var(--track); color: var(--text); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--track); }
  .bar { display: flex; height: 8px; width: 140px; border-radius: 4px; overflow: hidden; background: var(--track); }
  .bar span { display: block; height: 100%; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.fail, .pill.failed, .pill.error { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .pill.warn, .pill.running, .pill.blocked { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.passed { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.none, .pill.skipped, .pill.unknown, .pill.stopped { color: var(--muted); background: var(--track); }
  .pill.h-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.h-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.h-fail { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .pill.h-unknown { color: var(--muted); background: var(--track); }
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--track); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-height: 86px; }
  .tile:hover { background: var(--track); }
  .tile.h-ok { border-left-color: var(--ok); } .tile.h-warn { border-left-color: var(--warn); } .tile.h-fail { border-left-color: var(--fail); }
  .tile strong { display: block; margin-bottom: 4px; overflow-wrap: anywhere; }
  .tile .sig { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .tile .why { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .box h3 { font-size: 13px; margin: 0 0 8px; }
  .box ul { margin: 4px 0; padding-left: 18px; }
  form.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  form.inline label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  form.inline input, form.inline textarea, form.inline select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  form.inline label.check { display: flex; gap: 6px; align-items: center; font-weight: 400; color: var(--text); font-size: 13px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  td.mono { word-break: break-all; }
  h2 { font-size: 15px; margin: 22px 0 10px; }
  .back { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; margin-bottom: 10px; }
  pre.log { background: #0f0f0e; color: #d8d8d2; padding: 12px; border-radius: 10px; max-height: 360px; overflow: auto; font: 12px/1.4 var(--mono); white-space: pre-wrap; margin: 0; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .desc { white-space: pre-wrap; max-height: 280px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  .row { display: flex; gap: 12px; align-items: center; }
  .shots { display: flex; gap: 10px; overflow-x: auto; padding: 6px 0; }
  .shots figure { margin: 0; flex: 0 0 auto; width: 150px; }
  .shots img { width: 150px; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .shots figcaption { font-size: 11px; color: var(--muted); margin-top: 4px; }
  details.fc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  details.fc > summary { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; list-style: none; flex-wrap: wrap; }
  details.fc > summary::-webkit-details-marker { display: none; }
  details.fc[open] > summary { border-bottom: 1px solid var(--line); }
  .fc-body { padding: 4px 16px 14px; }
  .fc-body .k { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 10px; }
  .fc-body ul, .fc-body ol { margin: 4px 0; padding-left: 20px; }
  .fc-body ul.expect { list-style: none; padding-left: 0; }
  .fc-body ul.expect li { margin: 3px 0; }
  .reach { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .reach span { background: var(--track); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
  .reach b { color: var(--muted); font-weight: 400; }
  .pill.lvl-feature { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .pill.lvl-capability { color: var(--text); background: var(--track); }
  .pill.lvl-regression { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); }
  .pill.conf-high, .pill.st-approved { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.conf-medium, .pill.st-draft { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.sev-critical { color: #fff; background: var(--fail); }
  .pill.sev-high { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .pill.sev-medium { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.sev-low, .pill.sev-info { color: var(--muted); background: var(--track); }
  .pill.conf-low, .pill.st-rejected { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .branch { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--track); white-space: nowrap; cursor: pointer; border: 0; color: inherit; font: inherit; font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .bwrap { position: relative; }
  .bpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: 340px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 8px; }
  .bpop input { width: 100%; box-sizing: border-box; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .blist { max-height: 320px; overflow-y: auto; margin-top: 6px; }
  .blist button { display: block; width: 100%; text-align: left; padding: 5px 8px; border: 0; border-radius: 5px; background: none; color: inherit; font: inherit; font-size: 13px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blist button:hover, .blist button.on { background: var(--track); }
  .blist .cur { font-weight: 600; }
  .blist .none { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  .branch.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .jobs { font: inherit; font-size: 12px; padding: 3px 10px; border: 0; border-radius: 999px; cursor: pointer; white-space: nowrap; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .jobs[hidden] { display: none; }
  .banner { background: color-mix(in srgb, var(--fail) 12%, var(--panel)); border-bottom: 1px solid var(--fail); padding: 10px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-bottom-color: var(--warn); }
  ul.setup { list-style: none; padding: 0; margin: 0; }
  ul.setup li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  ul.setup li:last-child { border-bottom: 0; }
  ul.setup .what { flex: 1; min-width: 200px; }
  .src { font-size: 11px; color: var(--muted); font-weight: 400; }
  .split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
  .side { position: sticky; top: 70px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 90px); display: flex; flex-direction: column; }
  .side .head { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .side .head input { width: 100%; min-width: 0; }
  .side .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--track); color: var(--text); font-weight: 600; }
  .side ul { list-style: none; margin: 0; padding: 4px; overflow: auto; }
  .side li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .side li:hover { background: var(--track); }
  .side li.active { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
  .side li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side li .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .side li .d { width: 8px; height: 8px; border-radius: 50%; background: var(--track); flex: 0 0 auto; }
  .side li .d.fail { background: var(--fail); } .side li .d.draft { background: var(--warn); } .side li .d.ok { background: var(--ok); }
  .issues { margin: 12px 0; }
  .issue { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .issue:last-child { border-bottom: 0; }
  .issue .what { flex: 1; min-width: 220px; }
  .issue .k { font-size: 11px; }
  textarea.prompt { font: 12px/1.4 var(--mono); min-height: 220px; margin-top: 8px; }
  pre.diff { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 420px; overflow: auto; font: 12px/1.45 var(--mono); margin: 6px 0; white-space: pre-wrap; }
  pre.diff .add { color: var(--ok); } pre.diff .del { color: var(--fail); } pre.diff .hunk { color: var(--muted); }
  .glance { font-size: 13px; } .glance ul { margin: 4px 0; padding-left: 18px; } .glance code { font-family: var(--mono); font-size: 12px; background: var(--track); padding: 0 4px; border-radius: 4px; }
  .box.stale { border-color: var(--warn); }
  .box a { color: var(--accent); font-weight: 600; }
  /* Runs: the list on the left, the selected run beside it, each with its own scroll. */
  .runs-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
  .runs-list .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .runs-list .filters select, .runs-list .filters input { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
  .runs-list .filters input { flex: 1 1 160px; min-width: 0; }
  .runs-list .count { color: var(--muted); font-size: 12px; margin: 8px 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .runs-list td.res { overflow-wrap: anywhere; }
  tr.click.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  tr.click.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .runs-detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .runs-detail .dhead { display: flex; justify-content: flex-end; gap: 8px; position: sticky; top: -12px; background: var(--panel); padding: 4px 0; z-index: 1; }
  .runs-detail h2 { font-size: 16px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .runs-detail .empty { padding: 40px 12px; }
  @media (max-width: 1100px) {
    .runs-layout { grid-template-columns: 1fr; }
    .runs-detail { display: none; }
    .runs-detail.open { display: block; position: fixed; inset: 0; z-index: 30; max-height: none; border-radius: 0; border: 0; }
  }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } .side { position: static; max-height: 320px; } }
  @media (max-width: 720px) {
    header { flex-wrap: wrap; padding: 12px 16px; }
    main { padding: 16px; }
    .hide-sm { display: none; }
    table { font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <h1>Probe</h1>
  <select class="proj" id="proj" title="Project Studio shows: switch to another one Probe knows, or open a folder"></select>
  <div class="meta" id="meta">loading…</div>
  <div class="bwrap"><button class="branch" id="branch" title="Branch this project is on">…</button>
    <div class="bpop" id="bpop" hidden><input id="bq" placeholder="Search branches…" autocomplete="off"><div class="blist" id="blist"></div></div></div>
  <button class="jobs" id="jobs" hidden></button>
  <button class="btn secondary" id="refreshall" title="Read the project, its branch and the tickets again. Studio also updates on its own when files change.">↻ Refresh</button>
  <div class="spacer"></div>
  <nav>
    <button data-tab="atlas" class="active">Atlas</button>
    <button data-tab="cards">Cards</button>
    <button data-tab="verify">Verify</button>
    <button data-tab="tickets">Tickets</button>
    <button data-tab="security">Security</button>
    <button data-tab="runs">Runs</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="setup">Setup</button>
  </nav>
</header>
<div id="banner"></div>
<main id="view"></main>

<script>
const $view = document.getElementById("view");
const $meta = document.getElementById("meta");
const state = { tab: "atlas", scan: null, filter: "", group: "feature", view: "table", feature: null, eventSource: null, jobs: [] };

const api = (path, opts) => fetch(path, opts).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ago = (iso) => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  state.tab = b.dataset.tab; state.feature = null; render();
}));

// ── Project: Studio shows one at a time; the picker switches to any project Probe knows ──

const OPEN_OTHER = "__open_folder__";

async function loadProjects() {
  const data = await api("/api/projects").catch(() => null);
  if (!data) return;
  const sel = document.getElementById("proj");
  sel.innerHTML = data.projects.map((p) => `<option value="${esc(p.root)}" title="${esc(p.root)}" ${p.root === data.current.root ? "selected" : ""}>${esc(p.name)}</option>`).join("") +
    `<option value="${OPEN_OTHER}">Open another folder…</option>`;
  sel.dataset.current = data.current.root;
}

document.getElementById("proj").addEventListener("change", async (e) => {
  const sel = e.target;
  let root = sel.value;
  if (root === OPEN_OTHER) {
    root = (prompt("Project folder (full path):") || "").trim();
    if (!root) { sel.value = sel.dataset.current; return; }
  }
  const running = state.jobs.length;
  if (running && !confirm(`${running} run${running === 1 ? " is" : "s are"} still going in this project. They keep running; switch anyway?`)) { sel.value = sel.dataset.current; return; }
  sel.disabled = true;
  const res = await post("/api/projects/open", { root });
  sel.disabled = false;
  if (res.error) { alert(res.error); sel.value = sel.dataset.current; return; }
  // Everything on the page belonged to the old project.
  closeStream();
  Object.assign(state, { tab: "atlas", scan: null, feature: null, branchSeen: null, branchList: null, cardFilter: null, runs: null, verify: null, tickets: null, jobs: [] });
  history.replaceState(null, "", "#atlas");
  document.getElementById("banner").innerHTML = "";
  await loadProjects();
  if (typeof checkBranch === "function") checkBranch();
  render();
});

loadProjects();

function closeStream() { if (state.eventSource) { state.eventSource.close(); state.eventSource = null; } }

async function render() {
  closeStream();
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
  saveRoute();
  if (state.tab === "setup") await renderSetup();
  else if (state.tab === "atlas") await (state.feature ? renderFeature(state.feature) : renderAtlas());
  else if (state.tab === "cards") await renderCards();
  else if (state.tab === "verify") await renderVerify();
  else if (state.tab === "tickets") await renderTickets();
  else if (state.tab === "security") await renderSecurity();
  else if (state.tab === "runs") await renderRuns();
  else if (state.tab === "settings") await renderSettings();
  showJobs();
}

// ── Where the page is, in the address, so a reopened tab comes back to it ──

function saveRoute() {
  const sub = state.tab === "atlas" ? state.feature : state.tab === "cards" ? state.cardFilter?.feature : state.tab === "runs" ? state.runs?.selected : state.tab === "tickets" ? state.tickets?.selected : null;
  history.replaceState(null, "", "#" + state.tab + (sub ? "/" + encodeURIComponent(sub) : ""));
}

function loadRoute() {
  const m = /^#(atlas|cards|verify|tickets|security|runs|settings|setup)(?:\/(.+))?$/.exec(location.hash);
  if (!m) return false;
  goTo({ tab: m[1], feature: m[2] ? decodeURIComponent(m[2]) : null });
  return true;
}

function goTo(route) {
  state.tab = route.tab;
  state.feature = route.tab === "atlas" ? route.feature || null : null;
  if (route.tab === "runs") runsState().selected = route.feature || null;
  if (route.tab === "tickets" && route.feature) ticketsState().selected = route.feature;
  if (route.tab === "cards" && route.feature) state.cardFilter = { side: "all", q: "", level: "all", status: "all", ...state.cardFilter, feature: route.feature };
}

// ── Jobs: work the server is doing (drafting cards, unit runs, verify…), whoever started it ──
// The server is the record. A page opened mid-run asks for it, marks the buttons that started
// it as busy and follows the run, so closing the tab never hides work that is still going.

/** The same keys as the server's jobKeys (src/studio/jobs.ts). */
const jobKey = {
  unit: (f) => `unit:${f}`,
  backfill: (f) => `backfill:${f}`,
  explore: (f) => `explore:${f}`,
  unitwrite: (f) => `unitwrite:${f}`,
  card: (f, id) => `card:${f}/${id}`,
  login: (role) => `login:${role || "check"}`,
  security: (f) => `security:${f || "*"}`,
  verifyFeatures: (fs) => `verify:features:${[...fs].sort().join(",")}`,
  verifyOutdated: (fs) => `verify:outdated${fs && fs.length ? ":" + [...fs].sort().join(",") : ""}`,
  verifyBase: (base) => `verify:base:${base || ""}`,
  work: () => "work",
};

/** Where a job's button lives, to open the page on it. */
function routeOf(j) {
  const [kind, ...rest] = j.key.split(":");
  const arg = rest.join(":");
  if (kind === "init") return { tab: "setup" };
  if (kind === "work") return { tab: "tickets" };
  if (kind === "login") return { tab: "settings" };
  if (kind === "check") return { tab: "atlas" };
  if (kind === "security") return { tab: "security" };
  if (kind === "verify") {
    if (arg === "outdated") return { tab: "atlas" };
    if (arg.startsWith("outdated:") && !arg.includes(",")) return { tab: "cards", feature: arg.slice(9) };
    if (arg.startsWith("features:") && !arg.includes(",")) return { tab: "atlas", feature: arg.slice(9) };
    // A ticket's test has a button on Verify and one on its ticket in Tickets.
    if (arg.startsWith("ticket:") && state.tab !== "verify") return { tab: "tickets", feature: arg.slice(7) };
    return { tab: "verify" };
  }
  if (kind === "backfill" && arg.startsWith("ticket:")) return state.tab === "verify" ? { tab: "verify" } : { tab: "tickets", feature: arg.slice(7) };
  if (kind === "backfill" && j.feature === "*") return { tab: "cards" };
  if (["unit", "backfill", "explore", "unitwrite", "card"].includes(kind) && j.feature !== "*") return { tab: "atlas", feature: j.feature };
  // The Runs tab opens the run itself beside the list.
  return { tab: "runs", feature: j.runId };
}

function onRoute(route) {
  if (route.tab !== state.tab) return false;
  if (route.tab === "atlas") return (route.feature || null) === state.feature;
  if (route.tab === "cards") return !route.feature || route.feature === state.cardFilter?.feature;
  if (route.tab === "tickets") return !route.feature || route.feature === state.tickets?.selected;
  return true;
}

const jobLabel = (j) => `${j.kind} ${j.kind === "card" ? `${j.feature}/${j.cardId}` : j.feature === "*" ? "" : j.feature} · started ${ago(j.startedAt)}`;

async function refreshJobs() {
  const jobs = await api("/api/jobs").catch(() => null);
  if (!jobs) return;
  state.jobs = jobs.filter((j) => !j.child);
  showJobs();
}

/** Reflects the jobs on the page: the header count, busy buttons, and a run to follow. */
function showJobs() {
  const chip = document.getElementById("jobs");
  chip.hidden = !state.jobs.length;
  chip.textContent = `● ${state.jobs.length} running`;
  chip.title = state.jobs.map(jobLabel).join("\n") + "\nClick to open the latest";
  const running = new Set(state.jobs.map((j) => j.key));
  document.querySelectorAll("[data-job]").forEach((b) => {
    if (b.dataset.label === undefined && !b.disabled) b.dataset.label = b.textContent;
    if (running.has(b.dataset.job)) {
      if (b.dataset.marked) return;
      b.dataset.marked = "1";
      b.disabled = true;
      if (b.dataset.busy) b.textContent = b.dataset.busy;
    } else if (b.dataset.marked) {
      delete b.dataset.marked;
      b.disabled = false;
      if (b.dataset.label !== undefined) b.textContent = b.dataset.label;
    }
  });
  followJob();
}

/** Into an empty run panel: the run asked for, else the latest job this view started. */
function followJob() {
  const panel = document.getElementById("runpanel");
  if (!panel || panel.innerHTML.trim() || state.eventSource) return;
  if (state.showRun) {
    const id = state.showRun;
    state.showRun = null;
    return followRun(id, panel);
  }
  const wanted = state.followId && state.jobs.find((j) => j.runId === state.followId);
  state.followId = null;
  const job = wanted || (state.tab !== "runs" && [...state.jobs].reverse().find((j) => onRoute(routeOf(j))));
  // When it ends, the view reloads with what it made and shows the finished run again.
  if (job) followRun(job.runId, panel, () => { state.scan = null; state.showRun = job.runId; render(); });
}

document.getElementById("jobs").addEventListener("click", () => {
  const j = state.jobs[state.jobs.length - 1];
  if (!j) return;
  goTo(routeOf(j));
  state.followId = j.runId;
  render();
});
setInterval(() => { if (!document.hidden) refreshJobs(); }, 3000);

function coverageBar(s) {
  const t = Math.max(1, s.testable);
  const w = (n) => (100 * n / t).toFixed(1) + "%";
  return `<div class="bar" title="${s.direct} direct · ${s.referenced} referenced · ${s.untested} untested">
    <span style="width:${w(s.direct)};background:var(--ok)"></span>
    <span style="width:${w(s.referenced)};background:var(--warn)"></span>
  </div>`;
}

function runPill(r) {
  if (!r) return `<span class="pill none">not run</span>`;
  const label = r.status === "running" || r.status === "error" ? r.status : `${r.tests - r.failed}/${r.tests}`;
  return `<span class="pill ${r.status}" title="${esc(r.finishedAt || "")}${esc(whoRan(r))}">${label}</span>${freshPill(r)} <span class="muted">${ago(r.finishedAt)}</span>`;
}

const HEALTH_LABEL = { ok: "ok", warn: "warn", fail: "fail", unknown: "never run" };
function healthPill(f) {
  return `<span class="pill h-${f.health}" title="${esc(f.reasons.join("\n"))}">${HEALTH_LABEL[f.health]}</span>`;
}

function devicePill(d) {
  const ran = d.passed + d.failed + d.blocked + d.error;
  if (!ran && d.stale) return `<span class="pill warn" title="${d.stale} card results outdated: code or card changed since">⟳ ${d.stale} outdated</span>`;
  if (!ran) return d.notRun ? `<span class="pill none" title="${d.notRun} cards never run on a device">not run</span>` : `<span class="muted">—</span>`;
  const cls = d.failed ? "failed" : d.blocked || d.error ? "blocked" : "passed";
  return `<span class="pill ${cls}" title="${d.passed} passed · ${d.failed} failed · ${d.blocked} blocked · ${d.error} error · ${d.stale} outdated · ${d.maybe} maybe outdated · ${d.notRun} not run">${d.passed}/${ran + d.stale + d.notRun}</span>${d.stale ? ` <span class="pill warn" title="${d.stale} card results outdated: code or card changed since">⟳ ${d.stale}</span>` : ""}`;
}

/** Marks a result that no longer holds for the code checked out here. */
function freshPill(r) {
  if (!r || !r.fresh || r.fresh === "fresh" || r.fresh === "never") return "";
  const why = (r.freshReasons || []).join("\n");
  return r.fresh === "stale"
    ? ` <span class="pill warn" title="Outdated: ${esc(why)}">⟳ outdated</span>`
    : ` <span class="pill none" title="Maybe outdated: ${esc(why)}">? maybe</span>`;
}

function whoRan(r) {
  return r.remote ? ` · recorded by ${r.by || "someone else"} (no evidence on this machine)` : "";
}

function lastRunPill(r) {
  if (!r) return `<span class="pill none" title="never run on a device">not run</span>`;
  return `<span class="pill ${r.status}" title="last device run ${esc(r.runId)}, ${esc(r.at || "")}${esc(whoRan(r))}">${r.status}</span>${freshPill(r)}${r.perfIssues ? ` <span class="pill warn" title="performance warnings">perf</span>` : ""}`;
}

const GROUP_LABEL = { feature: "Features", platform: "Platform areas", all: "Features and areas" };

/** A feature's or platform area's manifest: its rules, and how many nothing proves yet. */
function manifestPill(f) {
  const m = f.manifest;
  if (!m) return `<span class="pill none" title="No manifest yet: Setup → Feature knowledge drafts one">none</span>`;
  return `<span class="pill ${m.unproven ? "warn" : "ok"}" title="${m.rules} rules · ${m.unproven} unproven">${m.rules} rule${m.rules === 1 ? "" : "s"}${m.unproven ? ` · ${m.unproven} unproven` : ""}</span>`;
}

function cardsPill(c) {
  if (!c) return `<span class="pill none">none</span>`;
  const title = `${c.approved} approved · ${c.draft} draft · ${c.rejected} rejected`;
  return `<span class="pill ${c.draft ? "warn" : "ok"}" title="${title}">${c.total}${c.draft ? ` · ${c.draft} to review` : ""}</span>`;
}

/** Features whose unit or card results are outdated: what "Bring up to date" would re-run. */
function outdatedCount(features) {
  return features.filter((f) => f.device.stale || f.device.maybe || f.unit?.fresh === "stale" || f.unit?.fresh === "maybe").length;
}

async function loadScan(refresh) {
  state.scan = await api("/api/scan", { method: refresh ? "POST" : "GET" });
  const p = state.scan.project;
  $meta.textContent = `${p.adapter} · scanned ${ago(state.scan.scannedAt)}`;
  document.title = `${p.name} · Probe`;
}

async function renderAtlas() {
  if (!state.scan) { $view.innerHTML = `<div class="empty">Scanning project…</div>`; await loadScan(false); }
  const watch = await api("/api/watch");
  const all = state.scan.features;
  const list = all
    .filter((f) => state.group === "all" || f.group === state.group)
    .filter((f) => f.id.toLowerCase().includes(state.filter.toLowerCase()));
  const sum = (k) => list.reduce((n, f) => n + f.stats[k], 0);
  const testable = sum("testable");
  const pct = (n) => testable ? Math.round(100 * n / testable) + "%" : "–";

  $view.innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">${GROUP_LABEL[state.group]}</div><div class="v">${list.length}</div></div>
      <div class="card"><div class="k">With a manifest</div><div class="v">${list.filter((f) => f.manifest).length}</div></div>
      <div class="card"><div class="k">Testable classes</div><div class="v">${testable}</div></div>
      <div class="card"><div class="k">Have a test class</div><div class="v" style="color:var(--ok)">${pct(sum("direct"))}</div></div>
      <div class="card"><div class="k">Only referenced</div><div class="v" style="color:var(--warn)">${pct(sum("referenced"))}</div></div>
      <div class="card"><div class="k">Untested</div><div class="v" style="color:var(--fail)">${pct(sum("untested"))}</div></div>
      <div class="card"><div class="k">Health</div><div class="v" style="font-size:15px;margin-top:6px">${["ok", "warn", "fail", "unknown"].map((h) => `<span class="pill h-${h}">${list.filter((f) => f.health === h).length} ${HEALTH_LABEL[h]}</span>`).join(" ")}</div></div>
    </div>
    <div class="toolbar">
      <div class="seg" id="view"><button data-v="table">Table</button><button data-v="map">Map</button></div>
      <input type="search" id="filter" placeholder="Filter…" value="${esc(state.filter)}">
      <div class="seg" id="group">
        <button data-g="feature">Features</button><button data-g="platform">Platform</button><button data-g="all">All</button>
      </div>
      <div class="legend hide-sm"><span><span class="dot" style="background:var(--ok)"></span>test class</span><span><span class="dot" style="background:var(--warn)"></span>referenced in tests</span><span><span class="dot" style="background:var(--track)"></span>untested</span></div>
      <div style="flex:1"></div>
      ${outdatedCount(all) ? `<button class="btn" id="uptodate" data-job="${esc(jobKey.verifyOutdated())}" data-busy="Bringing up to date…" title="Re-runs only results that are outdated, maybe outdated or missing for this code: unit tests, then cards on a device">⟳ Bring ${outdatedCount(all)} feature${outdatedCount(all) === 1 ? "" : "s"} up to date</button>` : ""}
      <button class="btn secondary" id="rescan">Rescan</button>
    </div>
    ${watchBanner(watch)}
    <div id="runpanel"></div>
    ${state.scan.excluded.length ? `<p class="muted">Excluded by probe.yaml: ${state.scan.excluded.map(esc).join(", ")}</p>` : ""}
    ${state.view === "map" ? `<div class="map">${list.map((f) => `<div class="tile h-${f.health}" data-id="${esc(f.id)}" title="${esc(f.reasons.join("\n"))}">
        <strong>${esc(f.id)}${stalePill(watch, f.id)}</strong>
        <div class="sig"><span>${f.manifest ? `${f.manifest.rules} rules` : "no manifest"}</span>${f.group === "platform" && f.usedBy ? `<span>used by ${f.usedBy}</span>` : ""}<span>unit ${f.unit ? (f.unit.failed ? `✗${f.unit.failed}` : "✓") : "—"}</span><span>${f.stats.testable ? Math.round(100 * f.stats.direct / f.stats.testable) : 0}% classes</span><span>cards ${f.cards ? f.cards.total : 0}</span><span>device ${f.device.passed}/${f.device.passed + f.device.failed + f.device.blocked + f.device.error + f.device.notRun}</span>${f.nav ? `<span>${f.nav.screens} screens</span>` : ""}</div>
        <div class="why">${esc(f.reasons[0] || (f.health === "ok" ? "all checks passed" : ""))}</div>
      </div>`).join("") || `<div class="empty">Nothing matches.</div>`}</div>` : `
    <table>
      <thead><tr>
        <th>${state.group === "platform" ? "Platform area" : state.group === "all" ? "Feature or area" : "Feature"}</th><th class="num hide-sm">Modules</th><th class="num">Testable</th><th>Unit coverage (static)</th>
        <th class="num hide-sm">Untested</th><th>Manifest</th><th>Cards</th><th>Last unit run</th><th>On device</th><th>Health</th>
      </tr></thead>
      <tbody>
        ${list.map((f) => `<tr class="click" data-id="${esc(f.id)}">
          <td><strong>${esc(f.id)}</strong>${stalePill(watch, f.id)}${f.group === "platform" && f.usedBy ? `<div class="muted" style="font-size:11px">used by ${f.usedBy}</div>` : ""}</td>
          <td class="num hide-sm">${f.stats.modules}</td>
          <td class="num">${f.stats.testable}</td>
          <td><div class="row">${coverageBar(f.stats)}<span class="muted">${f.stats.testable ? Math.round(100 * f.stats.direct / f.stats.testable) : 0}%</span></div></td>
          <td class="num hide-sm">${f.stats.untested}</td>
          <td>${manifestPill(f)}</td>
          <td>${cardsPill(f.cards)}</td>
          <td>${runPill(f.lastUnitRun)}</td>
          <td>${devicePill(f.device)}</td>
          <td>${healthPill(f)}</td>
        </tr>`).join("") || `<tr><td colspan="10" class="empty">Nothing matches.</td></tr>`}
      </tbody>
    </table>`}`;

  const filter = document.getElementById("filter");
  filter.addEventListener("input", () => { state.filter = filter.value; renderAtlas().then(() => { const f = document.getElementById("filter"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }); });
  document.querySelectorAll("#group button").forEach((b) => {
    b.classList.toggle("active", b.dataset.g === state.group);
    b.addEventListener("click", () => { state.group = b.dataset.g; renderAtlas(); });
  });
  document.getElementById("uptodate")?.addEventListener("click", async (e) => {
    if (!confirm("Re-run every outdated or missing result? Unit tests run first, then approved cards on an emulator (at most the max card runs from Settings).")) return;
    e.target.disabled = true;
    const res = await post("/api/verify", { outdated: true });
    if (res.error) { alert(res.error); e.target.disabled = false; return; }
    followRun(res.runId, document.getElementById("runpanel"), () => { state.scan = null; });
  });
  document.getElementById("rescan").addEventListener("click", async (e) => {
    e.target.disabled = true; e.target.textContent = "Scanning…";
    await loadScan(true); renderAtlas();
  });
  document.querySelectorAll("#view button").forEach((b) => {
    b.classList.toggle("active", b.dataset.v === state.view);
    b.addEventListener("click", () => { state.view = b.dataset.v; renderAtlas(); });
  });
  document.querySelectorAll("tr.click, .tile").forEach((tr) => tr.addEventListener("click", () => { state.feature = tr.dataset.id; render(); }));
  bindWatchBanner(() => renderAtlas());
}

// ── Keeping features current: stale marks, the check, drafted corrections ──

function stalePill(watch, id) {
  const e = watch.stale[id];
  if (!e) return "";
  // Reached through the module graph: none of its own files changed, code it depends on did.
  const via = !e.owned && e.dependsOn?.length ? e.dependsOn : null;
  return ` <span class="pill warn" title="${via ? `Depends on ${esc(via.join(", "))}, edited` : "Edited"} since its last check (${esc(e.sources.join(", "))}, ${ago(e.last)}):\n${esc(e.files.slice(0, 12).join("\n"))}">${via ? "dependency edited" : "edited"}</span>`;
}

function watchBanner(watch) {
  if (!watch.enabled) return "";
  const stale = Object.keys(watch.stale);
  const parts = [];
  if (watch.running) parts.push(`<span class="pill running">checking</span> <a href="#" data-follow="${esc(watch.running.runId)}">run ${esc(watch.running.runId)}</a>`);
  if (stale.length) parts.push(`${stale.length} feature${stale.length === 1 ? "" : "s"} edited since their last check: ${stale.map((id) => `<strong>${esc(id)}</strong>`).join(", ")}`);
  if (watch.drafts.length) parts.push(`${watch.drafts.length} drafted correction${watch.drafts.length === 1 ? "" : "s"} to review: ${watch.drafts.map((d) => `<a href="#" data-feature="${esc(d.feature)}">${esc(d.feature)}</a>`).join(", ")}`);
  if (!parts.length) return "";
  return `<div class="box stale"><div class="row" style="flex-wrap:wrap">${parts.map((p) => `<span>${p}</span>`).join('<span class="muted">·</span>')}<div style="flex:1"></div>${stale.length && !watch.running ? `<button class="btn secondary" id="checknow" title="Unit tests and manifest links of the edited features, then drafted corrections for review">✓ Check now</button>` : ""}</div></div>`;
}

function bindWatchBanner(refresh) {
  document.querySelectorAll("[data-follow]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); followRun(a.dataset.follow, document.getElementById("runpanel"), refresh); }));
  document.querySelectorAll("[data-feature]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); state.feature = a.dataset.feature; render(); }));
  document.getElementById("checknow")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    const res = await post("/api/watch/check", {});
    if (res.error) { alert(res.error); e.target.disabled = false; return; }
    followRun(res.runId, document.getElementById("runpanel"), refresh);
  });
}

/** Just enough markdown for a brief's At a glance: bullets, bold, code, links as text. */
function miniMd(text) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
  const items = [];
  for (const line of text.split("\n")) {
    if (/^\s*[-*] /.test(line)) items.push(line.replace(/^\s*[-*] /, ""));
    else if (items.length && line.trim()) items[items.length - 1] += " " + line.trim();
  }
  return items.length ? `<ul>${items.map((i) => `<li>${inline(i)}</li>`).join("")}</ul>` : `<p>${inline(text)}</p>`;
}

function diffHtml(diff) {
  return `<pre class="diff">${diff.split("\n").map((l) => `<span class="${l.startsWith("@@") ? "hunk" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : ""}">${esc(l)}</span>`).join("\n")}</pre>`;
}

async function renderKnowledge(id) {
  const k = await api("/api/knowledge/" + encodeURIComponent(id));
  // Looked up after the fetch: the page may have re-rendered while it loaded.
  const el = document.getElementById("knowledge");
  if (!el) return;
  const title = k.kind === "platform" ? "Platform area knowledge" : "Feature knowledge";
  // Who builds on whom, from the build files: an edit in a platform area makes its users stale.
  const links = [k.usedBy?.length ? `Used by ${k.usedBy.length}: ${k.usedBy.map(esc).join(", ")}` : "", k.uses?.length ? `Uses: ${k.uses.map(esc).join(", ")}` : ""].filter(Boolean);
  const linksHtml = links.length ? `<div class="muted" style="font-size:12px;margin-top:6px">${links.join(" · ")}</div>` : "";
  if (!k.manifest && !k.check && k.drafts.length) {
    el.innerHTML = `<div class="box"><h3>${title}</h3><span class="muted">No manifest yet; one is drafted. Review it in <a href="#" id="gosetup">Setup</a>.</span>${linksHtml}</div>`;
    el.querySelector("#gosetup").addEventListener("click", (e) => { e.preventDefault(); state.tab = "setup"; state.feature = null; render(); });
    return;
  }
  if (!k.manifest && !k.check) {
    el.innerHTML = `<div class="box"><h3>${title}</h3><span class="muted">No manifest yet. Run <code class="mono">probe init</code> (or Setup → Feature knowledge) to draft one, or write <code class="mono">${esc(k.file)}</code> by hand (format in <code class="mono">probe/features/README.md</code>). It gives ${k.kind === "platform" ? "this area a summary, the contract it keeps for the code built on it" : "this feature a summary, its rules"} and the tests that prove them; Probe then keeps them in step with the code.</span>${linksHtml}</div>`;
    return;
  }
  const m = k.manifest || {};
  const c = k.check || { broken: [], gaps: [], errors: [], unexplained: [], missingPaths: [], links: 0 };
  const brokenBy = {};
  for (const b of c.broken) (brokenBy[b.invariant] ||= []).push(b);
  const brokenCardsBy = {};
  for (const b of c.brokenCards || []) (brokenCardsBy[b.invariant] ||= []).push(b);
  // A card proves its rule only while its last pass still holds for this code.
  const cardPill = (x) => {
    const cls = x.freshness === "missing" || x.result === "failed" ? "fail" : x.result === "passed" && x.freshness === "fresh" ? "ok" : "warn";
    const run = x.freshness === "missing" ? "" : ` <button class="btn secondary" style="padding:1px 8px;font-size:11px" data-runcard="${esc(x.feature)}/${esc(x.id)}" data-job="${esc(jobKey.card(x.feature, x.id))}" data-busy="…" title="Run this card on a device">▶</button>`;
    return `<div style="margin:2px 0"><span class="pill ${cls}" title="${esc(x.text)}">card ${esc(x.id)}</span> <span class="muted" style="font-size:12px">${esc(x.title || "")} · ${esc(x.text)}</span>${run}</div>`;
  };
  const proof = (inv) => {
    const broken = brokenBy[inv.id] || [];
    const pills = [];
    if (inv.coveredBy.length) pills.push(`<span class="pill ${broken.length ? "fail" : "ok"}" title="${esc(inv.coveredBy.join("\n"))}">${inv.coveredBy.length - broken.length}/${inv.coveredBy.length} tests</span>`);
    const cards = (k.cards || {})[inv.id] || [];
    if (!inv.coveredBy.length && !cards.length) pills.push(`<span class="pill ${inv.gap ? "warn" : "fail"}" title="${esc(inv.gap || "no test, no card and no reason given")}">${inv.gap ? "unproven" : "unexplained"}</span>`);
    return pills.join(" ") + cards.map(cardPill).join("") +
      broken.map((b) => `<div class="muted" style="font-size:12px">✗ ${esc(b.entry)} — ${esc(b.problem)}${b.closest ? `; closest: “${esc(b.closest)}”` : ""}</div>`).join("") +

      <p style="margin:4px 0 8px">${esc(d.summary)}</p>
      ${d.diffs.map((x) => `<div class="mono muted">${esc(x.path)}${x.conflict ? ` <span class="pill fail">changed since the draft was made</span>` : ""}</div>${diffHtml(x.diff)}`).join("")}
      <div class="row"><button class="btn" data-approve="${esc(d.id)}" ${d.diffs.some((x) => x.conflict) ? "disabled" : ""}>Apply</button><button class="btn secondary" data-reject="${esc(d.id)}">Reject</button></div></div>`).join("")}
    <div class="box"><h3>${esc(m.name || id)} ${k.kind === "platform" ? `<span class="pill none">platform</span> ` : ""}${m.owner ? `<span class="muted" style="font-weight:400">· owner ${esc(m.owner)}</span>` : `<span class="pill warn" title="Nobody approves changes to this feature's manifest and brief yet">no owner</span>`}</h3>
      ${m.summary ? `<p style="margin:0 0 8px">${esc(m.summary)}</p>` : ""}
      ${k.glance ? `<div class="glance">${miniMd(k.glance)}</div>` : ""}
      <div class="muted" style="font-size:12px;margin-top:6px">${m.brief ? `Brief <span class="mono">${esc(m.brief)}</span> · ` : ""}manifest <span class="mono">${esc(k.file)}</span> · ${c.links} test links · ${c.cardLinks || 0} card links${c.broken.length + (c.brokenCards || []).length ? ` · <strong style="color:var(--fail)">${c.broken.length + (c.brokenCards || []).length} broken</strong>` : ""}</div>
      ${linksHtml}
      ${[...c.errors, ...c.missingPaths.map((p) => `path does not exist: ${p}`), ...c.unexplained.map((u) => `${u}: no test, no card and no gap given`)].map((e) => `<div style="color:var(--fail);font-size:12px">✗ ${esc(e)}</div>`).join("")}
    </div>
    ${m.invariants?.length ? `<details class="fc" ${c.broken.length ? "open" : ""}><summary><strong>Rules that must hold</strong> <span class="muted">${m.invariants.length} rules · ${c.gaps.length} unproven${c.broken.length ? ` · ${c.broken.length} broken links` : ""}</span></summary><div class="fc-body">
      <table><thead><tr><th>Rule</th><th>Proved by</th></tr></thead><tbody>${m.invariants.map((inv) => `<tr><td><strong class="mono" style="font-size:12px">${esc(inv.id)}</strong><div>${esc(inv.rule)}</div></td><td>${proof(inv)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    ${m.flows?.length ? `<details class="fc"><summary><strong>User flows</strong> <span class="muted">${m.flows.length}</span></summary><div class="fc-body"><ul>${m.flows.map((f) => `<li><span class="mono muted">${esc(f.id)}</span> ${esc(f.text)}</li>`).join("")}</ul>${m.deviceOnly?.length ? `<div class="k">Only on a device</div><ul>${m.deviceOnly.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}</div></details>` : ""}`;
  el.querySelectorAll("[data-runcard]").forEach((b) => b.addEventListener("click", async () => {
    const at = b.dataset.runcard.lastIndexOf("/");

  }));
  document.getElementById("checkfeature")?.addEventListener("click", async (e) => {
    e.target.disabled = true; e.target.textContent = "Checking…";

    if (res.error) { alert(res.error); e.target.disabled = false; e.target.textContent = "✓ Check now"; return; }

    const draftId = b.dataset.approve || b.dataset.reject;

    b.disabled = true;
    const res = await post(`/api/drafts/${encodeURIComponent(draftId)}/${approve ? "approve" : "reject"}`, {});

  }));
}

// Every action carries the branch the person is looking at; the server refuses it if the
// project has moved to another branch since (a checkout in a terminal or the IDE).
const post = async (path, body) => {
  const headers = { "content-type": "application/json" };
  if (state.branchSeen) headers["x-probe-branch"] = encodeURIComponent(state.branchSeen);
  const res = await api(path, { method: "POST", headers, body: JSON.stringify(body || {}) });
  if (res.branchChanged) checkBranch();
  return res;
};

async function checkBranch() {
  const b = await api("/api/branch").catch(() => null);
  if (!b) return;
  state.branchInfo = b;
  if (b.id && !state.branchSeen) state.branchSeen = b.id;
  const chip = document.getElementById("branch");
  chip.textContent = b.git ? `⎇ ${b.id}${b.git.dirty ? ` · ${b.git.dirty} uncommitted` : ""} ▾` : "no git";
  chip.disabled = !b.git;
  chip.className = "branch" + (b.warnings.length ? " warn" : "");
  chip.title = ["Branch this project is on" + (b.base ? `; verify compares with ${b.base}` : ""), ...b.warnings].join("\n");
  const banner = document.getElementById("banner");
  if (b.id && state.branchSeen && b.id !== state.branchSeen) {
    banner.innerHTML = `<div class="banner"><strong>The branch changed: ${esc(state.branchSeen)} → ${esc(b.id)}.</strong>
      <span>Actions are paused so nothing runs on code you did not mean to test.</span>
      <button class="btn" id="bok">Continue on ${esc(b.id)}</button></div>`;
    document.getElementById("bok").addEventListener("click", () => { state.branchSeen = b.id; state.scan = null; banner.innerHTML = ""; checkBranch(); render(); });
  } else if (!b.git || b.warnings.some((w) => /base branch itself|Detached/.test(w))) {
    banner.innerHTML = `<div class="banner warn">${b.warnings.map(esc).join(" · ")}</div>`;
  } else banner.innerHTML = "";
}
// The branch changes when someone checks out elsewhere: look again when the window comes back.
window.addEventListener("focus", () => checkBranch());
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkBranch(); refreshJobs(); } });
document.getElementById("refreshall").addEventListener("click", async (e) => {
  const b = e.currentTarget;
  b.disabled = true;
  try {
    await post("/api/refresh", {});
    state.scan = null;
    if (state.tickets) { state.tickets.data = null; state.tickets.refresh = true; }
    await checkBranch();
    render();
  } finally {
    b.disabled = false;
  }
});

// Branch picker: the list loads when it opens (slow on big repos) and filters as you type.
const $bpop = document.getElementById("bpop"), $bq = document.getElementById("bq"), $blist = document.getElementById("blist");

function renderBranchList() {
  const cur = state.branchInfo?.id;
  const words = $bq.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all = state.branchList || [];
  const hits = all.filter((x) => words.every((w) => x.toLowerCase().includes(w))).slice(0, 200);
  $blist.innerHTML = !state.branchList ? `<div class="none">Loading…</div>`
    : hits.length ? hits.map((x, i) => `<button data-b="${esc(x)}" class="${i === 0 && words.length ? "on" : ""} ${x === cur ? "cur" : ""}">${x === cur ? "✓ " : ""}${esc(x)}</button>`).join("")
    : `<div class="none">No branch matches.</div>`;
}

async function openBranchPicker() {
  $bpop.hidden = false;
  $bq.value = "";
  renderBranchList();
  $bq.focus();
  const b = await api("/api/branch?branches").catch(() => null);
  if (b) { state.branchList = b.branches; renderBranchList(); }
}

async function switchBranch(want) {
  $bpop.hidden = true;
  if (!want || want === state.branchInfo?.id) return;
  if (!confirm(`Switch this project's working tree to ${want}? Studio rescans afterwards.`)) return;
  const chip = document.getElementById("branch");
  chip.disabled = true;
  chip.textContent = `⎇ switching to ${want}…`;
  const res = await post("/api/branch/switch", { branch: want });
  chip.disabled = false;
  if (res.error) { alert(res.error); checkBranch(); return; }
  Object.assign(state, { branchSeen: res.id, branchList: null, scan: null, verify: null, runs: null });
  document.getElementById("banner").innerHTML = "";
  checkBranch();
  render();
}

document.getElementById("branch").addEventListener("click", (e) => { e.stopPropagation(); $bpop.hidden ? openBranchPicker() : ($bpop.hidden = true); });
$bpop.addEventListener("click", (e) => { e.stopPropagation(); const btn = e.target.closest("button[data-b]"); if (btn) switchBranch(btn.dataset.b); });
document.addEventListener("click", () => { $bpop.hidden = true; });
$bq.addEventListener("input", renderBranchList);
$bq.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $bpop.hidden = true;
  if (e.key === "Enter") { const first = $blist.querySelector("button[data-b]"); if (first) switchBranch(first.dataset.b); }
});

function followRun(runId, el, onDone) {
  closeStream();
  el.innerHTML = `<h2>Run ${esc(runId)} <span class="pill running" id="rs">running</span> <button class="btn stop" id="rstop" title="Kills its build or agent; the run ends as stopped and does not count toward health">■ Stop</button></h2><div id="rr"></div><pre class="log" id="log"></pre>`;
  const log = el.querySelector("#log");
  const stopBtn = el.querySelector("#rstop");
  stopBtn.addEventListener("click", async () => {
    if (!confirm(`Stop run ${runId}?`)) return;
    stopBtn.disabled = true; stopBtn.textContent = "Stopping…";
    const res = await stopRunReq(runId);
    if (res.error) { alert(res.error); stopBtn.remove(); }
  });
  const es = new EventSource(`/api/runs/${runId}/stream`);
  state.eventSource = es;
  es.onmessage = (msg) => {
    const e = JSON.parse(msg.data);
    if (e.type === "log") {
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
      log.textContent += e.line + "\n";
      if (atBottom) log.scrollTop = log.scrollHeight;
    } else if (e.type === "done") {
      es.close(); state.eventSource = null;
      const rs = el.querySelector("#rs"); rs.className = "pill " + e.run.status; rs.textContent = e.run.status;
      el.querySelector("#rstop")?.remove();
      const rr = el.querySelector("#rr");
      rr.innerHTML = `<div id="ru"></div>` + resultsTable(e.run) + `<div id="ri"></div>`;
      bindTicket(rr);
      renderUnblock(e.run, rr.querySelector("#ru"), el);
      renderIssues(e.run, rr.querySelector("#ri"), el);
      rr.querySelectorAll("a[data-open]").forEach((a) => a.addEventListener("click", (ev) => { ev.preventDefault(); state.tab === "runs" ? selectRun(a.dataset.open) : followRun(a.dataset.open, el); }));
      // Over at once here, not at the next poll, so a re-render does not mark its button busy again.
      state.jobs = state.jobs.filter((j) => j.runId !== e.run.id);
      onDone && onDone(e.run);
      showJobs();
    }
  };
  es.onerror = () => { es.close(); state.eventSource = null; };
}

const ISSUE_KIND = { test: "failing test", build: "build", card: "card failed", expectation: "not as expected", crash: "crash", perf: "performance", navigation: "navigation", security: "security" };

/** Problems a run found, each with the two ways to fix it: a prompt to paste anywhere, or a fix agent here. */
async function renderIssues(run, el, panel) {
  if (run.status === "running" || run.kind === "fix") return;
  const issues = await api(`/api/runs/${encodeURIComponent(run.id)}/issues`).catch(() => []);
  if (!Array.isArray(issues) || !issues.length) return;
  el.innerHTML = `<div class="box issues" style="border-color:var(--fail)"><h3>${issues.length} problem${issues.length === 1 ? "" : "s"} to fix</h3>
    ${issues.map((i) => `<div class="issue" data-issue="${esc(i.id)}">
      <div class="what">${i.security ? securityHead(i.security) : `<span class="pill none k">${esc(ISSUE_KIND[i.kind] || i.kind)}</span> <strong>${esc(i.title)}</strong>`}<div class="muted" style="font-size:12px">${esc(i.feature)}${i.cardId ? ` / ${esc(i.cardId)}` : ""}${i.runId !== run.id ? ` · run ${esc(i.runId)}` : ""}</div>${i.security ? securityBody(i.security) : ""}</div>
      ${i.security ? `<button class="btn secondary" data-dismiss title="Not a problem here: hide it from later runs, with the reason">Dismiss</button>` : ""}
      <button class="btn secondary" data-prompt title="A prompt with the problem, its evidence and the code to look at, for any coding agent">⧉ Fix prompt</button>
      <button class="btn" data-fix title="An agent edits the code to fix it, then Probe runs the unit tests and the card again. Nothing is committed.">✦ Fix</button>
      <div class="ip" style="flex:1 1 100%"></div></div>`).join("")}</div>`;
  el.querySelectorAll(".issue").forEach((row) => {
    const id = row.dataset.issue;
    const out = row.querySelector(".ip");
    row.querySelector("[data-prompt]").addEventListener("click", async () => {
      if (out.innerHTML) { out.innerHTML = ""; return; }
      const r = await api(`/api/issues/${encodeURIComponent(id)}/prompt`);
      out.innerHTML = `<textarea class="prompt" readonly>${esc(r.prompt)}</textarea><div class="row"><button class="btn secondary" data-copy>Copy</button><span class="muted" data-copied></span></div>`;
      out.querySelector("[data-copy]").addEventListener("click", async () => {
        const ta = out.querySelector("textarea");
        try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand("copy"); }
        out.querySelector("[data-copied]").textContent = "Copied.";
      });
    });
    row.querySelector("[data-dismiss]")?.addEventListener("click", async () => {
      const reason = prompt(`Why is this not an issue here?\n\n${row.querySelector("strong").textContent}`);
      if (!reason || !reason.trim()) return;
      const res = await post(`/api/issues/${encodeURIComponent(id)}/dismiss`, { reason });
      if (res.error) return alert(res.error);
      row.remove();
    });
    row.querySelector("[data-fix]").addEventListener("click", async () => {
      const branch = state.branchSeen ? ` on ${state.branchSeen}` : "";
      if (!confirm(`An agent will change the code${branch} to fix:\n\n${row.querySelector("strong").textContent}\n\nThen Probe runs the unit tests (and the card again). Nothing is committed: you review the changes. Start?`)) return;
      const res = await post(`/api/issues/${encodeURIComponent(id)}/fix`);
      if (res.error) return alert(res.error);
      followRun(res.runId, panel);
    });
  });
}

/** A blocked run: why it stopped, what to do, and its blocked cards run again. */
async function renderUnblock(run, el, panel) {
  if (run.status === "running" || !["card", "verify", "work"].includes(run.kind)) return;
  const u = await api(`/api/runs/${encodeURIComponent(run.id)}/unblock`).catch(() => null);
  if (!u || !u.cards) return;
  const n = u.cards.length;
  el.innerHTML = `<div class="box unblock" style="border-color:var(--warn)">
    <h3 style="margin-top:0"><span class="pill blocked">blocked</span> ${esc(u.title)}</h3>
    ${u.seen ? `<p class="muted" style="margin:6px 0">The agent: “${esc(u.seen.length > 400 ? u.seen.slice(0, 400) + "…" : u.seen)}”</p>` : ""}
    <p style="margin:6px 0"><strong>To do:</strong> ${esc(u.todo)}</p>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
      ${u.settings === "accounts" ? `<button class="btn secondary" data-ub-accounts>Open Test accounts</button>` : ""}
      ${u.canSignIn ? `<select data-ub-role>${u.roles.map((r) => `<option>${esc(r)}</option>`).join("")}</select><button class="btn secondary" data-ub-signin title="Probe opens the app, signs out of the other account and signs in as this test account">Sign in as a test account</button>` : ""}
      <button class="btn" data-ub-again title="${esc(u.cards.join("\n"))}">↻ Run again: ${n} card${n === 1 ? "" : "s"}</button>
      <span class="muted" data-ub-out></span>
    </div>
    <div class="ub-run"></div></div>`;
  const out = el.querySelector("[data-ub-out]");
  el.querySelector("[data-ub-accounts]")?.addEventListener("click", () => { state.tab = "settings"; state.settingsTab = "accounts"; render(); });
  el.querySelector("[data-ub-signin]")?.addEventListener("click", async (ev) => {
    const role = el.querySelector("[data-ub-role]").value;
    ev.target.disabled = true;
    const res = await post("/api/login", { role });
    if (res.error) { ev.target.disabled = false; return (out.textContent = res.error); }
    out.textContent = `Signing in as ${role}… Run again once it is done.`;
    followRun(res.runId, el.querySelector(".ub-run"), () => { ev.target.disabled = false; });
  });
  el.querySelector("[data-ub-again]").addEventListener("click", async (ev) => {
    ev.target.disabled = true;
    const res = await post(`/api/runs/${encodeURIComponent(run.id)}/again`);
    if (res.error) { ev.target.disabled = false; return (out.textContent = res.error); }
    followRun(res.runId, panel);
  });
}

}

function securityBody(f) {

    ${f.evidence ? `<pre class="mono" style="font-size:12px;white-space:pre-wrap;margin:4px 0;background:var(--track);padding:6px;border-radius:6px">${esc(f.evidence)}</pre>` : ""}

const stopRunReq = (id) => post(`/api/runs/${encodeURIComponent(id)}/stop`);

function perfBlock(p) {
  if (!p) return "";
  const cell = (k, v) => `<div class="card"><div class="k">${k}</div><div class="v" style="font-size:17px">${v}</div></div>`;
  return `<div class="cards" style="margin:8px 0">${p.startupMs !== undefined ? cell("Cold start", p.startupMs + " ms") : ""}${cell("Frames", p.frames)}${cell("Janky", p.jankyPct + "%")}${cell("p50 / p90 / p99", `${p.p50Ms} / ${p.p90Ms} / ${p.p99Ms} ms`)}${p.memoryMb ? cell("Memory", p.memoryMb + " MB") : ""}</div>` +
    p.issues.map((i) => `<p style="color:var(--warn)">⚠ ${esc(i)}</p>`).join("");
}

function evidence(run) {
  const file = (name) => `/api/runs/${encodeURIComponent(run.id)}/files/${name}`;
  const shots = run.timeline.filter((t) => t.screenshot);
  const pageErrors = run.webErrors || [];
  return `<p>${esc(run.device)}${run.build ? ` · build <strong>${esc(run.build.label)}</strong>` : ""} · ${run.timeline.length} steps · $${run.costUsd.toFixed(2)}</p>` + perfBlock(run.perf) +
    (pageErrors.length ? `<details style="margin:8px 0"><summary style="color:var(--warn)">${pageErrors.length} page error${pageErrors.length === 1 ? "" : "s"} during the run (console, failed requests)</summary><pre class="log">${pageErrors.map(esc).join("\n")}</pre></details>` : "") +
    run.crashes.map((c) => `<pre class="log" style="color:var(--fail)">${esc(c)}</pre>`).join("") +
    (run.video ? `<video controls preload="metadata" src="${file(run.video)}" style="max-height:420px;max-width:100%;border-radius:10px;margin:8px 0"></video>` : "") +
    (shots.length ? `<div class="shots">${shots.map((t, i) => `<figure><a href="${file(t.screenshot)}" target="_blank"><img loading="lazy" src="${file(t.screenshot)}" alt="step ${i + 1}"></a><figcaption>${esc(t.action)} · ${esc(t.detail).slice(0, 80)}</figcaption></figure>`).join("")}</div>` : "") +
    `<details style="margin-top:8px"><summary class="muted">All ${run.timeline.length} steps</summary><ol class="mono">${run.timeline.map((t) => `<li>${esc(t.action)} — ${esc(t.detail)}</li>`).join("")}</ol></details>`;

function ticketButton(run) {
  if (run.status === "passed" || run.status === "running" || run.status === "stopped" || run.kind === "backfill" || run.kind === "login" || run.kind === "init") return "";
  return `<div class="row" style="margin:10px 0"><button class="btn secondary" data-ticket="${esc(run.id)}">⧉ Ticket draft</button></div><div class="ticketpanel"></div>`;

async function bindTicket(el) {

    const [d, cfg] = await Promise.all([api(`/api/runs/${encodeURIComponent(b.dataset.ticket)}/ticket`), api("/api/tickets/config")]);

    panel.querySelector("[data-copy]").addEventListener("click", () => navigator.clipboard.writeText(`${d.title}\n\n${d.body}`).then(() => (panel.querySelector("[data-out]").textContent = "Copied.")));

  }

  }
  if (run.kind === "explore") {
    return err + `${run.issues.length ? `<div class="box" style="border-color:var(--fail)"><h3>Issues</h3><ul>${run.issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      <table style="margin:8px 0"><thead><tr><th>Screen</th><th>Reach</th></tr></thead><tbody>${run.screens.map((sc) => `<tr><td>${esc(sc.name)}</td><td>${sc.reach.map(esc).join(" → ")}</td></tr>`).join("")}</tbody></table>` + evidence(run) + ticketButton(run);
  }
  if (run.kind === "unitwrite") {
    return err + `<p>Targets: ${run.targets.map(esc).join(", ")} · $${run.costUsd.toFixed(2)}${run.unitRun ? ` · <a href="#" data-open="${esc(run.unitRun)}">unit run</a>` : ""}</p>
      <ul class="mono">${run.files.map((f) => `<li style="${run.outsideTests.includes(f) ? "color:var(--warn)" : ""}">${run.outsideTests.includes(f) ? "⚠ " : "+ "}${esc(f)}</li>`).join("")}</ul>
      <p class="muted">Nothing is committed: review the files in your working tree.</p>`;
  }
  if (run.kind === "card") {
    const v = run.verdict;
    const exp = v ? `<table style="margin:8px 0"><tbody>${v.expectations.map((e) => `<tr><td>${e.met === true ? "✅" : e.met === false ? "❌" : "❔"}</td><td>${esc(e.text)}<br><span class="muted">${esc(e.evidence)}</span></td></tr>`).join("")}</tbody></table>` : "";
    return err + `<p class="muted">${esc(run.feature)} / ${esc(run.cardId)}${run.parent ? ` · part of <a href="#" data-open="${esc(run.parent)}">verify ${esc(run.parent)}</a>` : ""}</p>` + (v?.notes ? `<p>${esc(v.notes)}</p>` : "") + exp + evidence(run) + ticketButton(run);
  }
  if (run.kind === "security") {
    const sev = ["critical", "high", "medium", "low", "info"].map((s) => [s, run.findings.filter((f) => f.severity === s).length]).filter(([, n]) => n);
    return (run.status === "error" ? err : "") + `<p>${run.feature === "*" ? "Whole project" : esc(run.feature)} · ${run.files} files · platforms: ${run.platforms.map(esc).join(", ") || "—"}${run.costUsd ? ` · $${run.costUsd.toFixed(2)}` : ""}</p>
      <p>${sev.map(([s, n]) => `<span class="pill sev-${s}">${n} ${s}</span>`).join(" ") || `<span class="pill passed">no open findings</span>`}${run.dismissed ? ` <span class="muted">· ${run.dismissed} dismissed</span>` : ""}</p>
      <table style="margin:8px 0"><thead><tr><th>Layer</th><th>Status</th><th>Note</th></tr></thead><tbody>${run.layers.map((l) => `<tr><td>${esc(l.layer)}</td><td><span class="pill ${l.status === "ran" ? "passed" : l.status === "error" ? "error" : "skipped"}">${esc(l.status)}</span></td><td class="muted">${esc(l.note || "")}</td></tr>`).join("")}</tbody></table>`;
  }
  if (run.kind === "fix") {
    const link = (id, label) => id ? ` · <a href="#" data-open="${esc(id)}">${label}</a>` : "";
    return err + `<p><strong>${esc(run.issue.title)}</strong></p>
      <p class="muted">${esc(run.feature)} · $${run.costUsd.toFixed(2)}${link(run.issue.runId, "where it was found")}${link(run.unitRun, "unit run")}${link(run.recheckRun, "device recheck")}</p>
      ${run.securityRecheck ? `<p>${run.securityRecheck.stillFound ? `<span class="pill failed">still found</span>` : `<span class="pill passed">check passes</span>`} <span class="muted">${esc(run.securityRecheck.note)}</span></p>` : ""}

  }
  if (run.kind === "check") {
    const link = (id, label) => id ? `<a href="#" data-open="${esc(id)}">${esc(label)}</a>` : esc(label);

      ${features.map((f) => `<tr><td><strong>${esc(f.feature)}</strong>${f.owned ? "" : `<br><span class="muted">depends on the change</span>`}${f.note ? `<br><span class="muted">${esc(f.note)}</span>` : ""}</td>
        <td>${f.unitStatus ? `<span class="pill ${f.unitStatus}">${link(f.unitRun, f.unitStatus)}</span>` : "—"}
          ${(f.failures || []).map((x) => `<div class="mono" style="color:var(--fail);font-size:12px;margin-top:4px">✗ ${esc(x)}</div>`).join("")}
          ${(f.deviceRules || []).length ? `<div class="muted" style="font-size:12px;margin-top:4px">Only a device proves: ${f.deviceRules.map(esc).join(", ")}</div>` : ""}</td>
        <td>${f.manifest ? `${f.manifest.links} links${f.manifest.broken ? ` · <strong style="color:var(--fail)">${f.manifest.broken} broken</strong>` : ""}${f.manifest.gaps ? ` · ${f.manifest.gaps} unproven` : ""}` : "—"}
          ${f.draftId ? `<div style="font-size:12px;margin-top:4px">✎ correction drafted · <a href="#setup">review in Setup</a></div>` : ""}</td></tr>`).join("")}
      </tbody></table>` : `<p>Nothing was stale.</p>`}
      ${(run.skipped || []).length ? `<details><summary class="muted">${run.skipped.length} left for a later check</summary><p class="mono muted">${run.skipped.map(esc).join(", ")}</p></details>` : ""}`;
  }
  if (run.kind === "backfill") {
    return err + `<p>${run.written.length} cards written · $${run.costUsd.toFixed(2)}</p>` +
      (run.written.length ? `<p class="mono muted">${run.written.map(esc).join(" · ")}</p>` : "");
  }
  // Unit runs, and anything this page does not know yet: never let a missing field blank the panel.
  const results = run.results || [];
  if (!results.length) return err;
  return err + ticketButton(run) + `<table style="margin-bottom:12px"><thead><tr><th>Module</th><th class="num">Tests</th><th class="num">Failed</th><th class="num">Skipped</th><th class="num">Time</th></tr></thead><tbody>
    ${results.map((r) => `<tr><td class="mono">${esc(r.module)}${r.cached ? ` <span class="pill none" title="Code unchanged since the last build; results reused">cached</span>` : ""}</td><td class="num">${r.tests}</td><td class="num" style="${r.failed ? "color:var(--fail);font-weight:700" : ""}">${r.failed}</td><td class="num">${r.skipped}</td><td class="num">${(r.durationMs / 1000).toFixed(1)}s</td></tr>
      ${r.failures.map((x) => `<tr><td colspan="5" class="mono" style="color:var(--fail)">✗ ${esc(x.className)}.${esc(x.name)}<br><span class="muted">${esc(x.message || "")}</span></td></tr>`).join("")}`).join("")}
  </tbody></table>`;
