const LEVEL_TABS = [["all", "All"], ["feature", "Overview"], ["capability", "Flows"], ["regression", "Regressions"]];
const SIDE_FILTERS = [["all", "All"], ["draft", "To review"], ["failing", "Failing"], ["outdated", "Outdated"], ["notrun", "Never run"]];

/** One entry per feature: its counts, and the dot that says what needs attention first. */
function cardFeatures(all) {
  const by = new Map();
  for (const c of all) {
    const f = by.get(c.feature) || { id: c.feature, cards: [], draft: 0, approved: 0, failing: 0, notrun: 0, outdated: 0 };
    f.cards.push(c);
    if (c.status === "draft") f.draft++;
    if (c.status === "approved") f.approved++;
    if (c.lastRun && ["failed", "error"].includes(c.lastRun.status) && c.lastRun.fresh !== "stale") f.failing++;
    if (c.lastRun && (c.lastRun.fresh === "stale" || c.lastRun.fresh === "maybe") && c.status !== "rejected") f.outdated++;
    if (!c.lastRun && c.status !== "rejected") f.notrun++;
    by.set(c.feature, f);
  }
  return [...by.values()].sort((a, b) => a.id.localeCompare(b.id));
}

async function renderCards() {
  if (!state.cardFilter) state.cardFilter = { side: "all", q: "", level: "all", status: "all", feature: null };
  const fl = state.cardFilter;
  const all = await api("/api/cards");
  if (!all.length) {
    $view.innerHTML = `<div class="empty">No cards yet. Open a feature in Atlas and choose ✦ Draft cards, or <button class="btn secondary" id="bfall" data-job="${esc(jobKey.backfill("*"))}" data-busy="Agents drafting…">✦ Draft cards for every feature</button></div><div id="runpanel"></div>`;
    return bindBackfillAll();
  }
  const features = cardFeatures(all);
  const listed = features
    .filter((f) => !fl.q || (f.id + " " + f.cards.map((c) => c.title + " " + c.tickets.join(" ")).join(" ")).toLowerCase().includes(fl.q.toLowerCase()))
    .filter((f) => fl.side === "all" || f[fl.side] > 0);
  // Open on what needs a person: a failing feature, else one with drafts.
  if (!fl.feature || !features.some((f) => f.id === fl.feature)) fl.feature = (features.find((f) => f.failing) || features.find((f) => f.draft) || features[0]).id;
  saveRoute();
  const f = features.find((x) => x.id === fl.feature);
  const cards = f.cards.filter((c) => (fl.level === "all" || c.level === fl.level) && (fl.status === "all" || c.status === fl.status));
  const total = (k) => features.reduce((n, x) => n + x[k], 0);
  const dot = (x) => (x.failing ? "fail" : x.draft || x.outdated ? "draft" : x.approved ? "ok" : "");

  $view.innerHTML = `
    <div class="toolbar">
      <span><strong>${all.length}</strong> cards in <strong>${features.length}</strong> features</span>
      <span class="pill st-draft">${total("draft")} to review</span>
      <span class="pill st-approved">${total("approved")} approved</span>
      ${total("failing") ? `<span class="pill failed">${total("failing")} failing</span>` : ""}
      <div style="flex:1"></div>
      <button class="btn secondary" id="bfall" data-job="${esc(jobKey.backfill("*"))}" data-busy="Agents drafting…" title="Runs a background agent per feature that has no cards yet">✦ Draft cards for features without any</button>
    </div>
    <div id="runpanel"></div>
    <div class="split">
      <aside class="side">
        <div class="head">
          <input type="search" id="cq" placeholder="Find a feature, card or ticket…" value="${esc(fl.q)}">
          <div class="chips">${SIDE_FILTERS.map(([k, label]) => `<button class="chip ${fl.side === k ? "active" : ""}" data-side="${k}">${label}${k === "all" ? "" : ` ${total(k)}`}</button>`).join("")}</div>
        </div>
        <ul>${listed.map((x) => `<li data-f="${esc(x.id)}" class="${x.id === f.id ? "active" : ""}" title="${x.draft} to review · ${x.approved} approved · ${x.failing} failing · ${x.notrun} never run">
          <span class="d ${dot(x)}"></span><span class="name">${esc(x.id)}</span><span class="n">${x.draft ? `${x.draft}/` : ""}${x.cards.length}</span></li>`).join("") || `<li class="muted">No feature matches.</li>`}</ul>
      </aside>
      <section>
        <div class="toolbar">
          <h2 style="margin:0">${esc(f.id)}</h2>
          <span class="muted">${f.cards.length} cards · ${f.approved} approved · ${f.draft} to review${f.failing ? ` · <span style="color:var(--fail)">${f.failing} failing</span>` : ""}${f.outdated ? ` · <span style="color:var(--warn)">${f.outdated} outdated</span>` : ""}</span>
          <div style="flex:1"></div>
          ${f.outdated || f.notrun ? `<button class="btn secondary" id="rerunold" data-job="${esc(jobKey.verifyOutdated([f.id]))}" data-busy="Re-running…" title="Runs this feature's approved cards whose result is outdated or missing">⟳ Re-run ${f.outdated + f.notrun} outdated / never run</button>` : ""}
          ${f.draft ? `<button class="btn secondary" id="approveall" title="Approve every draft card of ${esc(f.id)}">Approve all ${f.draft} drafts</button>` : ""}
        </div>
        <div class="toolbar">
          <div class="seg" id="clv">${LEVEL_TABS.map(([k, label]) => `<button data-l="${k}" class="${fl.level === k ? "active" : ""}">${label} <span class="muted">${k === "all" ? f.cards.length : f.cards.filter((c) => c.level === k).length}</span></button>`).join("")}</div>
          <div class="seg" id="cst">${["all", "draft", "approved", "rejected"].map((k) => `<button data-s="${k}" class="${fl.status === k ? "active" : ""}">${k}</button>`).join("")}</div>
        </div>
        <div id="cardlist">${cards.length ? cards.map(cardHtml).join("") : `<div class="empty">No cards here with these filters.</div>`}</div>
      </section>
    </div>`;

  bindCardActions(document.getElementById("cardlist"), renderCards);
  const q = document.getElementById("cq");
  q.addEventListener("input", () => {
    const v = q.value.toLowerCase();
    // Filter the sidebar in place, so typing never loses focus.
    $view.querySelectorAll(".side li[data-f]").forEach((li) => {
      const x = features.find((y) => y.id === li.dataset.f);
      li.style.display = !v || (x.id + " " + x.cards.map((c) => c.title + " " + c.tickets.join(" ")).join(" ")).toLowerCase().includes(v) ? "" : "none";
    });
  });
  q.addEventListener("change", () => { fl.q = q.value; });
  $view.querySelectorAll(".side li[data-f]").forEach((li) => li.addEventListener("click", () => { fl.feature = li.dataset.f; fl.level = "all"; render(); }));
  $view.querySelectorAll("button[data-side]").forEach((b) => b.addEventListener("click", () => { fl.side = b.dataset.side; renderCards(); }));
  $view.querySelectorAll("#clv button").forEach((b) => b.addEventListener("click", () => { fl.level = b.dataset.l; renderCards(); }));
  $view.querySelectorAll("#cst button").forEach((b) => b.addEventListener("click", () => { fl.status = b.dataset.s; renderCards(); }));
  document.getElementById("rerunold")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    const res = await post("/api/verify", { outdated: true, features: [f.id] });
    if (res.error) { alert(res.error); e.target.disabled = false; return; }
    followRun(res.runId, document.getElementById("runpanel"), () => renderCards());
  });
  const approveAll = document.getElementById("approveall");
  if (approveAll) approveAll.addEventListener("click", async () => {
    if (!confirm(`Approve all ${f.draft} draft cards of ${f.id}? Approved cards run on a device in every verify.`)) return;
    approveAll.disabled = true;
    for (const c of f.cards.filter((x) => x.status === "draft")) await post(`/api/cards/${encodeURIComponent(c.feature)}/${encodeURIComponent(c.id)}/status`, { status: "approved" });
    renderCards();
  });
  bindBackfillAll();
}

function bindBackfillAll() {
  document.getElementById("bfall")?.addEventListener("click", async (e) => {
    if (!confirm("Draft cards for every feature that has none? This runs one agent per feature and can take a while.")) return;
    e.target.disabled = true;
    const res = await post("/api/cards/*/backfill");
    if (res.error) { alert(res.error); e.target.disabled = false; return; }
    followRun(res.runId, document.getElementById("runpanel"), () => { state.scan = null; renderCards(); });
  });
}

// ── Runs: a filtered list with the selected run beside it, and a link (#runs/<id>) for each ──

const RUNS_PAGE = 50;
const TRIGGER = { claude: "Claude", agent: "an agent's", commit: "commit", editor: "editor", manual: "manual" };
const PROBLEM = new Set(["failed", "error"]);

function runsState() {
  if (!state.runs) state.runs = { data: null, kind: "all", status: "all", feature: "all", q: "", limit: RUNS_PAGE, selected: null };
  return state.runs;
}

function runResult(r) {
  if (r.kind === "backfill") return `${(r.written || []).length} cards · $${(r.costUsd || 0).toFixed(2)}`;
  if (r.kind === "card") return `${esc(r.cardId)} · ${(r.timeline || []).length} steps · $${(r.costUsd || 0).toFixed(2)}${r.perf?.issues?.length ? ` · <span style="color:var(--warn)">perf ⚠</span>` : ""}`;
  if (r.kind === "verify") return `vs ${esc(r.base)} · ${r.features.length} features · ${r.features.reduce((n, f) => n + f.cards.filter((c) => c.runId).length, 0)} card runs`;
  if (r.kind === "explore") return `${r.screens.length} screens · ${r.issues.length} issues`;
  if (r.kind === "login") return r.login ? (r.login.state === "logged_in" ? (r.login.role ? `as ${esc(r.login.role)}` : "non-test account") : r.login.state.replace("_", " ")) : "—";
  if (r.kind === "unitwrite") return `${r.files.length} files · $${(r.costUsd || 0).toFixed(2)}`;
  if (r.kind === "check") return (r.features || []).map((f) => `${esc(f.feature)} <span class="pill ${f.unitStatus || "none"}">${f.unitStatus || "—"}</span>${f.draftId ? " ✎" : ""}`).join(" ") || "nothing stale";
  if (r.kind === "fix") return `${esc(r.issue.title.slice(0, 70))} · ${r.files.length} files`;
  if (r.kind === "init") return `${(r.drafts || []).length} drafts`;
  if (r.kind === "security") return `${(r.findings || []).length} open${(r.findings || []).some((f) => f.severity === "critical") ? ` · <strong style="color:var(--fail)">${r.findings.filter((f) => f.severity === "critical").length} critical</strong>` : ""}`;
  const results = r.results || [];
  const t = results.reduce((n, x) => n + x.tests, 0), f = results.reduce((n, x) => n + x.failed, 0);
  if (r.status === "error" && !t) return `<span style="color:var(--fail)">build failed</span>`;
  return `${t} tests${f ? ` · <strong style="color:var(--fail)">${f} failed</strong>` : ""}`;
}

function filteredRuns() {
  const s = runsState();
  const q = s.q.trim().toLowerCase();
  return s.data.filter((r) =>
    (s.kind === "all" || r.kind === s.kind) &&
    (s.status === "all" || (s.status === "problems" ? PROBLEM.has(r.status) : r.status === s.status)) &&
    (s.feature === "all" || r.feature === s.feature || (r.features || []).some((f) => f.feature === s.feature)) &&
    (!q || [r.id, r.feature, r.cardId, r.kind].some((x) => String(x || "").toLowerCase().includes(q))));
}

async function renderRuns() {
  const s = runsState();
  $view.innerHTML = `<div class="empty">Loading runs…</div>`;
  s.data = await api("/api/runs");
  if (!s.data.length) { $view.innerHTML = `<div class="empty">No runs yet. Open a feature in Atlas and run its unit tests.</div>`; return; }
  const kinds = [...new Set(s.data.map((r) => r.kind))].sort();
  const features = [...new Set(s.data.flatMap((r) => [r.feature, ...(r.features || []).map((f) => f.feature)]).filter((f) => f && f !== "*"))].sort();
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label)}</option>`;
  $view.innerHTML = `<div class="runs-layout">
    <section class="runs-list">
      <div class="filters">
        <select id="fk" title="Kind">${opt("all", "All kinds", s.kind)}${kinds.map((k) => opt(k, k, s.kind)).join("")}</select>
        <select id="fs" title="Status">${opt("all", "Any status", s.status)}${opt("problems", "Failed or error", s.status)}${["passed", "running", "stopped"].map((k) => opt(k, k, s.status)).join("")}</select>
        <select id="ff" title="Feature">${opt("all", "All features", s.feature)}${features.map((f) => opt(f, f, s.feature)).join("")}</select>
        <input id="fq" type="search" placeholder="Search run, card…" value="${esc(s.q)}">
      </div>
      <div id="runrows"></div>
    </section>
    <aside class="runs-detail" id="rundetail"></aside>
  </div>`;
  const bind = (id, key, ev = "change") => document.getElementById(id).addEventListener(ev, (e) => { s[key] = e.target.value; s.limit = RUNS_PAGE; renderRunRows(); });
  bind("fk", "kind"); bind("fs", "status"); bind("ff", "feature"); bind("fq", "q", "input");
  renderRunRows();
  // Opened from a link: bring its row into view too, showing more of the list if it is further down.
  if (s.selected) {
    const at = filteredRuns().findIndex((r) => r.id === s.selected);
    if (at >= s.limit) { s.limit = Math.ceil((at + 1) / RUNS_PAGE) * RUNS_PAGE; renderRunRows(); }
    document.querySelector("#runrows tr.sel")?.scrollIntoView({ block: "center" });
    showRun(s.selected);
  }
  else document.getElementById("rundetail").innerHTML = `<div class="empty">Select a run to see its result, evidence and fixes.</div>`;
}

function renderRunRows() {
  const s = runsState();
  const all = filteredRuns();
  const shown = all.slice(0, s.limit);
  const el = document.getElementById("runrows");
  if (!el) return;
  el.innerHTML = !all.length ? `<div class="empty">No runs match these filters.</div>` : `<table><thead><tr><th>When</th><th>Feature</th><th>Kind</th><th>Status</th><th>Result</th></tr></thead><tbody>
    ${shown.map((r) => `<tr class="click${r.id === s.selected ? " sel" : ""}" data-id="${esc(r.id)}">
      <td><span title="${esc(r.finishedAt || r.startedAt)}">${ago(r.finishedAt || r.startedAt)}</span><br><span class="mono muted" style="font-size:11px">${esc(r.id)}</span></td>
      <td>${esc(r.feature)}</td><td>${esc(r.kind)}</td>
      <td><span class="pill ${r.status}">${r.status}</span>${r.status === "running" ? ` <button class="btn stop" data-stop="${esc(r.id)}">■ Stop</button>` : ""}</td>
      <td class="res">${runResult(r)}</td></tr>`).join("")}</tbody></table>`;
  el.insertAdjacentHTML("beforeend", `<div class="count"><span>${shown.length} of ${all.length} runs${all.length < s.data.length ? ` (${s.data.length} in all)` : ""}</span>${all.length > shown.length ? `<button class="btn secondary" id="rmore">Show ${Math.min(RUNS_PAGE, all.length - shown.length)} more</button>` : ""}</div>`);
  el.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => selectRun(tr.dataset.id)));
  el.querySelector("#rmore")?.addEventListener("click", () => { s.limit += RUNS_PAGE; renderRunRows(); });
  el.querySelectorAll("button[data-stop]").forEach((b) => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!confirm(`Stop run ${b.dataset.stop}?`)) return;
    b.disabled = true;
    const res = await stopRunReq(b.dataset.stop);
    if (res.error) alert(res.error);
    setTimeout(renderRuns, 1500);
  }));
}

/** Opens a run beside the list and puts it in the address, so the link reopens it. */
function selectRun(id) {
  runsState().selected = id;
  saveRoute();
  document.querySelectorAll("#runrows tr.click").forEach((tr) => tr.classList.toggle("sel", tr.dataset.id === id));
  showRun(id);
}

function closeRun() {
  closeStream();
  runsState().selected = null;
  saveRoute();
  document.querySelectorAll("#runrows tr.sel").forEach((tr) => tr.classList.remove("sel"));
  const panel = document.getElementById("rundetail");
  panel.classList.remove("open");
  panel.innerHTML = `<div class="empty">Select a run to see its result, evidence and fixes.</div>`;
}

function showRun(id) {
  const panel = document.getElementById("rundetail");
  if (!panel) return;
  panel.classList.add("open");
  panel.scrollTop = 0;
  panel.innerHTML = `<div class="dhead"><button class="btn secondary" id="rlink" title="Copy a link to this run">⧉ Link</button><button class="btn secondary" id="rclose" title="Close">✕</button></div><div id="rbody"></div>`;
  panel.querySelector("#rclose").addEventListener("click", closeRun);
  panel.querySelector("#rlink").addEventListener("click", (e) => navigator.clipboard.writeText(location.href).then(() => { e.target.textContent = "Copied"; }));
  // A run that ends while it is open refreshes the list, so its row shows how it ended.
  followRun(id, panel.querySelector("#rbody"), () => api("/api/runs").then((runs) => { runsState().data = runs; renderRunRows(); }));
}

    ${sec.dismissed.length ? `<div class="box"><h3>Dismissed (${sec.dismissed.length})</h3><table><thead><tr><th>Check</th><th>Where</th><th>Reason</th><th></th></tr></thead><tbody>${sec.dismissed.map((d) => `<tr><td class="mono">${esc(d.check)}</td><td class="mono muted">${esc(d.file || "—")}</td><td>${esc(d.reason)}<br><span class="muted" style="font-size:12px">${ago(d.at)}</span></td><td><button class="btn secondary" data-undismiss="${esc(d.fingerprint)}">Undo</button></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  const panel = document.getElementById("runpanel");

  document.querySelectorAll("[data-undismiss]").forEach((b) => b.addEventListener("click", async () => {
    await post("/api/security/undismiss", { fingerprint: b.dataset.undismiss });

    const res = await post("/api/security", { feature: sf.feature.value || undefined, agent: sf.agent.checked, url: sf.url.value.trim() || undefined });
    if (res.error) return alert(res.error);
    followRun(res.runId, panel, () => {});
  });
}

async function renderVerify() {
  if (!state.verify) state.verify = { base: "" };
  $view.innerHTML = `<div class="empty">Reading the change…</div>`;
  const [ch, br, options] = await Promise.all([api("/api/changes" + (state.verify.base ? `?base=${encodeURIComponent(state.verify.base)}` : "")), api("/api/branch?branches"), api("/api/test-options")]);
  const here = br.git ? `<strong>${esc(br.id)}</strong> @ <span class="mono">${esc(br.git.commit)}</span>${br.git.dirty ? ` + ${br.git.dirty} uncommitted file(s)` : ""}` : "no git";

      ${ch.features.length ? `<table style="margin-top:8px"><thead><tr><th>Feature</th><th>Changed files</th></tr></thead><tbody>${ch.features.map((f) => `<tr><td><strong>${esc(f.feature)}</strong></td><td class="mono muted">${f.files.slice(0, 6).map(esc).join("<br>")}${f.files.length > 6 ? `<br>… ${f.files.length - 6} more` : ""}</td></tr>`).join("")}</tbody></table>` : ""}
      ${ch.unowned.length ? `<details style="margin-top:8px"><summary class="muted">${ch.unowned.length} files outside any module</summary><p class="mono muted">${ch.unowned.map(esc).join("<br>")}</p></details>` : ""}
    </div>
    <div class="box"><h3>From a ticket</h3>
      <form class="inline" id="tf">
        <label>Ticket<input name="ticket" placeholder="PROJ-1234" required></label>

      </form>
      <div id="tinfo"></div>
      <form class="inline" id="tc" style="margin-top:10px">
        <label style="flex:1 1 100%">Ticket text (optional: paste the description and acceptance criteria)<textarea name="text" placeholder="As a user I can…"></textarea></label>
        <label>Feature(s), when no commit names the ticket yet<input name="features" placeholder="comment, chat"></label>

    if (!ticket()) return;
    const t = await api("/api/tickets/" + encodeURIComponent(ticket()));
    document.getElementById("tinfo").innerHTML = `<div style="margin-top:10px">${t.url ? `<a href="${esc(t.url)}" target="_blank">${esc(t.id)}</a>` : `<strong>${esc(t.id)}</strong>`} · features: ${t.features.map(esc).join(", ") || "none"} · cards: ${t.cards.map(esc).join(", ") || "none"}
      <ul class="mono muted">${t.commits.map((c) => `<li>${esc(c.hash)} ${esc(c.date)} ${esc(c.subject)}</li>`).join("") || "<li>No commits mention it.</li>"}</ul></div>`;
  });
  document.getElementById("tverify").addEventListener("click", async () => {
    if (!ticket()) return;
    const res = await post("/api/verify", { ticket: ticket(), cards: "all" });
    if (res.error) return alert(res.error);
    followRun(res.runId, document.getElementById("runpanel"), () => { state.scan = null; });
  });
  document.getElementById("tc").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!ticket()) return alert("Enter the ticket id above.");
    const tc = e.target;
    const res = await post("/api/tickets/cards", { ticket: ticket(), text: tc.text.value, features: tc.features.value.split(",").map((x) => x.trim()).filter(Boolean) });
    if (res.error) return alert(res.error);
    followRun(res.runId, document.getElementById("runpanel"), () => { state.scan = null; });
  });
}

// ── What a test runs against: this code, a finished build, or the web app ──

/** The picker's fields, for a form.inline. `options` comes from /api/test-options. */
function targetPicker(options, chosen, build) {
  if (!options.length) return `<span class="muted" style="flex:1 1 100%">Nothing to run cards on yet: this project builds no Android app. To test a web app, set its address in Settings → Builds and web.</span>`;
  const pick = options.find((o) => o.id === chosen && !o.missing) || options.find((o) => !o.missing);
  return `<label>Test against<select name="against">${options.map((o) => `<option value="${esc(o.id)}" ${o.missing ? "disabled" : ""} ${pick && o.id === pick.id ? "selected" : ""}>${esc(o.label)}${o.missing ? " — " + esc(o.missing) : ""}</option>`).join("")}</select></label>
    <label class="buildwrap" style="display:none">Build<input name="build" list="buildlist" value="${esc(build || "")}" autocomplete="off" style="width:240px"><datalist id="buildlist"></datalist></label>`;
}

function bindTargetPicker(form, options, onChange) {
  if (!form.against) return;
  const sync = async () => {
    const o = options.find((x) => x.id === form.against.value);
    form.querySelector(".buildwrap").style.display = o && o.source ? "" : "none";
    form.build.placeholder = o && o.source === "file" ? "path to the .apk or .aab" : "newest, or a build number";
    const list = form.querySelector("datalist");
    list.innerHTML = "";
    if (o && (o.source === "firebase" || o.source === "play")) {
      const builds = await api("/api/builds?source=" + o.source).catch(() => null);
      if (Array.isArray(builds)) list.innerHTML = builds.map((b) => `<option value="${esc(b.value)}">${esc(b.label)}</option>`).join("");
      else if (builds && builds.error) form.build.title = builds.error;
    }
  };
  form.against.addEventListener("change", () => { onChange && onChange(form.against.value); sync(); });
  sync();
}

/** What the picker says, as a run's options. An error string when a build file is needed and none is given. */
function readTarget(form, options) {
  const o = form.against && options.find((x) => x.id === form.against.value);
  if (!o) return {};
  const value = form.build.value.trim();
  if (o.source === "file" && !value) return { error: "Give the path of the .apk or .aab to test." };
  return { target: o.target, build: o.source ? { source: o.source, value: value || undefined } : undefined };
}

// ── Tickets: the tracker's tickets waiting for a test ──

function ticketsState() {
  return state.tickets || (state.tickets = { selected: null, against: null, refresh: false, q: "" });
}

const BUILD_STATE = {
  included: ["passed", "contains the ticket's commits"],
  missing: ["failed", "does not contain the ticket's commits"],
  unknown: ["unknown", "cannot tell: no git tag for this build, or no commit names the ticket"],
};

function ticketDetail(t, options, st) {

  return `<div class="row" style="align-items:start"><h2 style="margin-top:0;flex:1"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.id)}</a> ${esc(t.title)}</h2>
      <button class="btn secondary" id="tkhide" title="${t.group === "hidden" ? "Show it in your list again" : "Hide it from your list on this machine"}">${t.group === "hidden" ? "Show again" : "Hide"}</button></div>

    <p class="muted" style="margin-top:0">${t.sourceLabel ? `${esc(t.sourceLabel)} · ` : ""}${esc(t.status)}${t.author ? ` · written by ${esc(t.author)}` : ""}${t.assignee ? ` · assigned to ${esc(t.assignee)}` : ""} · updated ${ago(t.updatedAt)}${t.labels.length ? ` · ${t.labels.map(esc).join(", ")}` : ""}</p>
    <p>${t.build ? `Build <strong class="mono">${esc(t.build)}</strong> ${bs ? `<span class="pill ${bs[0]}" title="${t.buildTag ? "git tag " + esc(t.buildTag) : ""}">${bs[1]}</span>` : ""}` : `<span class="muted">The ticket names no build.</span>`}</p>
    <div class="desc">${esc(t.description) || `<span class="muted">No description.</span>`}</div>
    <p>${t.commits} commit${t.commits === 1 ? "" : "s"} name it · features: ${t.features.map(esc).join(", ") || `<span class="muted">none yet</span>`} · cards: ${t.cards.map((c) => `<span class="mono">${esc(c)}</span>`).join(", ") || `<span class="muted">none yet</span>`}</p>
    <form class="inline" id="tkf">
      ${targetPicker(options, st.against, t.build)}
      <button class="btn" type="submit" data-job="verify:ticket:${esc(t.id)}" data-busy="Testing…" ${canTest && options.length ? "" : "disabled"} title="${canTest ? "An agent runs this ticket's cards, then the cards of the features it touched" : "Draft cards from the ticket first"}">▶ Test this ticket</button>
      ${t.features.length ? "" : `<label>Feature it belongs to<input name="features" placeholder="checkout" style="width:160px" title="No commit names the ticket yet, so Probe cannot tell which feature it is about"></label>`}
      <button class="btn secondary" type="button" id="tkcards" data-job="backfill:ticket:${esc(t.id)}" data-busy="Drafting…" title="An agent reads the ticket and the code, and drafts the cards that check it">✦ Draft cards from the ticket</button>
    </form>
    ${t.lastRun ? `<div class="row" style="margin-top:12px;flex-wrap:wrap">Last test <span class="pill ${esc(t.lastRun.status)}">${esc(t.lastRun.status)}</span> <span class="muted">${ago(t.lastRun.at)}</span>
      <button class="btn secondary" type="button" id="tkshow">Show</button>
      <button class="btn secondary" type="button" id="tkpost" ${t.lastRun.status === "running" ? "disabled" : ""}>Post result to the ticket</button></div>` : ""}
    <div id="tkpostpanel"></div>
    <div id="runpanel" style="margin-top:12px"></div>
    <h3 style="margin-top:16px">Your instructions for this ticket</h3>
    <textarea id="tknotes" rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit" placeholder="Anything the agent must know or be careful about, e.g. “Don't touch the payment SDK; the fix belongs in CheckoutViewModel.”">${esc((ticketsState().notes || {})[tkKey(t)] || "")}</textarea>
    <p class="muted" style="margin:4px 0 0;font-size:12px">Kept on this machine. Sent to the agent ahead of the ticket's text when this ticket is in a workbench run.</p>
    <h3 style="margin-top:16px">Talk about it in Slack</h3><div id="tktalk"><span class="muted">Searching this project's channels…</span></div>`;

// ── Tickets: the workbench. Your tickets from every tracker of this project; tick some, choose
// what the agent does for each, and it works through them one by one, a commit per ticket.

const tkKey = (t) => `${t.source || ""}/${t.id}`;
const notesKey = () => "probe.notes." + (document.getElementById("proj").dataset.current || "");
function loadNotes() { try { return JSON.parse(localStorage.getItem(notesKey()) || "{}"); } catch { return {}; } }
function saveNotes(n) { try { localStorage.setItem(notesKey(), JSON.stringify(n)); } catch { /* private window: kept for this visit */ } }
const tkQuery = (t) => (t.source ? `?source=${encodeURIComponent(t.source)}` : "");
const GROUPS = [["mine", "For me"], ["notForMe", "Not for me"], ["hidden", "Hidden"], ["all", "All"]];

/** The same rules as the server's commitMessage (src/tickets/workbench.ts), for the live preview. */
function previewCommit(pattern, t, area) {
  const words = `${(t.labels || []).join(" ")} ${t.title}`.toLowerCase();
  const type = /\b(bug|fix|crash|broken|error|regression|defect)\b/.test(words) ? "fix" : /\b(test|tests|coverage)\b/.test(words) ? "test" : /\b(docs?|documentation|readme)\b/.test(words) ? "docs" : /\b(chore|refactor|cleanup|upgrade|bump)\b/.test(words) ? "chore" : "feat";
  const title = t.title.trim().replace(/\s+/g, " ").replace(/[.\s]+$/, "");
  return pattern.replace(/\{key\}/g, t.id).replace(/\{title\}/g, title).replace(/\{type\}/g, type).replace(/\{area\}/g, area || "")
    .replace(/\(\s*\)/g, "").replace(/\[\s*\]/g, "").replace(/ {2,}/g, " ").trim();
}

/** Loads the tickets and settings once; filters, ticks and choosing a ticket redraw from that copy. */
async function renderTickets(local) {
  const st = ticketsState();
  st.picked = st.picked || new Set();
  st.group = st.group || "mine";
  st.statuses = st.statuses || new Set();
  st.label = st.label || "";
  st.notes = st.notes || loadNotes();
  if (!local || !st.data || st.refresh) {
    if (!st.data) $view.innerHTML = `<div class="empty">Reading tickets…</div>`;
    const [box, options, wb, conns] = await Promise.all([
      api("/api/inbox" + (st.refresh ? "?refresh" : "")), api("/api/test-options"), api("/api/workbench/settings"), api("/api/connections"),
    ]);
    st.data = { box, options, wb, conns };
  }
  st.refresh = false;
  const { box, options, wb, conns } = st.data;
  const listScroll = document.getElementById("tklist")?.scrollTop || 0;
  st.steps = st.steps || new Set(wb.steps);
  st.pattern = st.pattern ?? wb.commitPattern;
  const projectName = conns.project.name;
  st.ai = conns.ai;
  if (!box.connected) {
    $view.innerHTML = `<div class="box"><h3>Tickets for ${esc(projectName)}</h3>
      <p style="margin-top:0">Connect Jira or Linear to this project, and its tickets show up here. Tick the ones you want, choose what the agent does for each, and it works through them with a commit per ticket.</p>
      <p class="muted">${esc(box.missing)}</p>
      <button class="btn" id="tkconnect">Open this project's connections</button></div>`;
    document.getElementById("tkconnect").addEventListener("click", () => { state.tab = "settings"; state.settingsTab = "connections"; render(); });
    return;
  }
  const all = box.tickets;
  const sources = [...new Set(all.map((t) => t.sourceLabel).filter(Boolean))];
  const inGroup = (t) => st.group === "all" ? t.group !== "hidden" : t.group === st.group;
  const counts = Object.fromEntries(GROUPS.map(([g]) => [g, all.filter((t) => (g === "all" ? t.group !== "hidden" : t.group === g)).length]));
  const grouped = all.filter(inGroup);
  const statuses = [...new Set(grouped.map((t) => t.status))].sort();
  const labels = [...new Set(grouped.flatMap((t) => t.labels))].sort();
  for (const s of [...st.statuses]) if (!statuses.includes(s)) st.statuses.delete(s);
  const visible = grouped.filter((t) => (!st.statuses.size || st.statuses.has(t.status)) && (!st.label || t.labels.includes(st.label)) &&
    (!st.q || `${t.id} ${t.title}`.toLowerCase().includes(st.q.toLowerCase())));
  for (const k of [...st.picked]) if (!all.some((t) => tkKey(t) === k)) st.picked.delete(k);
  if (!all.some((t) => tkKey(t) === st.selected)) st.selected = visible[0] ? tkKey(visible[0]) : null;
  const sel = all.find((t) => tkKey(t) === st.selected);

  $view.innerHTML = `
    <div class="box"><div class="row" style="flex-wrap:wrap;gap:8px">
      <strong>Tickets · ${esc(projectName)}</strong>
      <span class="muted">${esc(sources.join(" + ") || "")}${box.me && box.me.length ? ` · you are ${esc(box.me.join(", "))}` : ""}</span>
      <span style="flex:1"></span>
      <button class="btn secondary" id="tkrules" title="Which tickets are not for you, and how commits are named">Rules</button>
      ${box.fetchedAt ? `<span class="muted" style="font-size:12px" title="${esc(box.fetchedAt)}">from the tracker ${ago(box.fetchedAt)}</span>` : ""}
      <button class="btn secondary" id="tkrefresh" title="Read the tickets from the tracker again">Refresh</button></div>
      <div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${GROUPS.map(([g, label]) => `<button class="chip ${st.group === g ? "active" : ""}" data-g="${g}">${label} ${counts[g]}</button>`).join("")}</div>
      ${statuses.length > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center"><span class="muted" style="font-size:12px">Status</span>${statuses.map((s) => `<button class="chip ${st.statuses.has(s) ? "active" : ""}" data-s="${esc(s)}">${esc(s)} ${grouped.filter((t) => t.status === s).length}</button>`).join("")}</div>` : ""}
      ${box.error ? `<p style="color:var(--fail);margin-bottom:0">${esc(box.error)}</p>` : ""}
      ${(box.warnings || []).map((w) => `<p style="color:var(--warn);margin-bottom:0">${esc(w)}</p>`).join("")}</div>
    <div id="workpanel"></div>
    <div class="split">
      <div class="side"><div class="head">
        <input type="search" id="tkq" placeholder="Find a ticket…" value="${esc(st.q)}">
        ${labels.length ? `<select id="tklabel"><option value="">Any label</option>${labels.map((l) => `<option ${l === st.label ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : ""}
        <label class="muted" style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="tkall" ${visible.length && visible.every((t) => st.picked.has(tkKey(t))) ? "checked" : ""}> Select all ${visible.length}</label></div>
        <ul id="tklist">${visible.map((t) => `<li data-t="${esc(tkKey(t))}" class="${tkKey(t) === st.selected ? "active" : ""}" title="${esc(t.title)}${t.why ? " · not for you: " + esc(t.why) : ""}">
          <input type="checkbox" data-pick="${esc(tkKey(t))}" ${st.picked.has(tkKey(t)) ? "checked" : ""} aria-label="Select ${esc(t.id)}">
          <span class="name"><span class="mono">${esc(t.id)}</span> ${st.notes[tkKey(t)] ? `<span title="Has your instructions">✎</span> ` : ""}${esc(t.title)}</span>
          <span class="n">${esc(t.status)}</span></li>`).join("") || `<li class="muted" style="cursor:default">No ticket here.</li>`}</ul></div>
      <div><div class="box" id="tkdetail">${sel ? ticketDetail(sel, options, st) : `<div class="empty">Choose a ticket.</div>`}</div></div></div>
    <div id="tkbar"></div>`;

  const rerender = () => renderTickets(true);
  const list = document.getElementById("tklist");
  if (list) list.scrollTop = listScroll;
  document.getElementById("tkrefresh").addEventListener("click", () => { st.refresh = true; rerender(); });
  document.getElementById("tkrules").addEventListener("click", () => { state.tab = "settings"; state.settingsTab = "workbench"; render(); });
  $view.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => { st.group = b.dataset.g; st.statuses.clear(); rerender(); }));
  $view.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => { st.statuses.has(b.dataset.s) ? st.statuses.delete(b.dataset.s) : st.statuses.add(b.dataset.s); rerender(); }));
  document.getElementById("tkq").addEventListener("change", (e) => { st.q = e.target.value; rerender(); });
  document.getElementById("tklabel")?.addEventListener("change", (e) => { st.label = e.target.value; rerender(); });
  document.getElementById("tkall").addEventListener("change", (e) => { visible.forEach((t) => (e.target.checked ? st.picked.add(tkKey(t)) : st.picked.delete(tkKey(t)))); rerender(); });
  $view.querySelectorAll("[data-pick]").forEach((cb) => {
    cb.addEventListener("click", (e) => e.stopPropagation());
    cb.addEventListener("change", () => { cb.checked ? st.picked.add(cb.dataset.pick) : st.picked.delete(cb.dataset.pick); renderWorkBar(all, wb, st); });
  });
  $view.querySelectorAll("#tklist li[data-t]").forEach((li) => li.addEventListener("click", () => { st.selected = li.dataset.t; rerender(); }));
  renderWorkBar(all, wb, st);
  const running = state.jobs.find((j) => j.key === "work");
  if (running || st.workRun) showWork(running ? running.runId : st.workRun, st);
  if (sel) bindTicketDetail(sel, options, st, rerender);
}

/** The bar under the list: what the agent does for the ticked tickets, the commit name, and Start. */
function renderWorkBar(all, wb, st) {
  const bar = document.getElementById("tkbar");
  const picked = all.filter((t) => st.picked.has(tkKey(t)));
  if (!picked.length) { bar.innerHTML = ""; return; }
  const first = picked[0];
  const coding = (st.ai && st.ai.use && st.ai.use.coding) || {};
  bar.innerHTML = `<div class="box" style="position:sticky;bottom:0;margin-top:14px;border-color:var(--accent)">
    <div class="row" style="flex-wrap:wrap"><strong>${picked.length} ticket${picked.length === 1 ? "" : "s"} selected</strong>
      <span class="muted">${picked.map((t) => esc(t.id)).join(", ")}</span><span style="flex:1"></span>
      <button class="btn secondary" id="wbclear">Clear</button></div>
    <p class="muted" style="margin:8px 0 6px">What should the agent do for each ticket? It works through them one at a time.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px">${wb.allSteps.map((s) => `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-step="${s.id}" ${st.steps.has(s.id) ? "checked" : ""}> ${esc(s.label)}</label>`).join("")}</div>
    <form class="inline" id="wbf" style="margin-top:10px">
      <label style="flex:1 1 320px">Commit message <span class="src">{key} {title} {type} {area}</span><input name="pattern" class="mono" value="${esc(st.pattern)}"></label>
      ${(() => { const ai = st.ai; const coding = ai.use.coding || {}; st.account = st.account ?? (coding.account || ""); st.model = st.model ?? (coding.model || "");
        return `<label>Coding account<select name="account"><option value="">${ai.accounts.length ? "As in Settings (" + esc((ai.accounts.find((a) => a.id === coding.account) || ai.accounts[0]).name) + ")" : "CLI's own login"}</option>${ai.accounts.map((a) => `<option value="${a.id}" ${st.account === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
        <label>Coding model<select name="model"><option value="">As in Settings (${esc(coding.model || ai.model || "default")})</option>${ai.models.filter(([m]) => m).map(([m, l]) => `<option value="${esc(m)}" ${st.model === m ? "selected" : ""}>${esc(l.split(" — ")[0])}</option>`).join("")}${st.model && !ai.models.some(([m]) => m === st.model) ? `<option selected>${esc(st.model)}</option>` : ""}</select></label>`; })()}
      <label title="What “Test on the device” runs for each ticket">Device test<select name="uiScope"><option value="ticket" ${st.uiScope !== "feature" ? "selected" : ""}>Only the ticket's cards</option><option value="feature" ${st.uiScope === "feature" ? "selected" : ""}>Ticket's cards + its features' cards</option></select></label>
      <label>Effort<select name="effort"><option value="">${esc(coding.effort ? "As in Settings (" + coding.effort + ")" : "CLI default")}</option>${(st.ai.efforts || []).map((e) => `<option ${st.effort === e ? "selected" : ""}>${e}</option>`).join("")}</select></label>
      <label style="flex:1 1 100%">Instructions for every ticket in this run <span class="src">optional · each ticket can also have its own, on its page</span>
        <textarea name="notes" rows="2" style="padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit" placeholder="e.g. Keep changes small. Don't change public APIs. Follow the existing MVI pattern.">${esc(st.batchNotes || "")}</textarea></label>
      ${picked.some((t) => st.notes[tkKey(t)]) ? `<p class="muted" style="flex:1 1 100%;margin:0">✎ Your own instructions go with ${picked.filter((t) => st.notes[tkKey(t)]).map((t) => esc(t.id)).join(", ")}.</p>` : ""}
      <button class="btn" type="submit" data-job="work" data-busy="Working…">▶ Start ${picked.length} ticket${picked.length === 1 ? "" : "s"}</button>
    </form>
    <p class="muted" style="margin:6px 0 0" id="wbprev"></p>
    <p class="muted" style="margin:6px 0 0">Commits stay on this machine on branch <strong>${esc(state.branchSeen || "the current branch")}</strong>. Nothing is pushed. A ticket's tracker is only changed if you tick “Comment on the ticket”.</p>
  </div>`;
  const prev = () => {
    const commit = st.steps.has("commit");
    document.getElementById("wbprev").innerHTML = commit ? `First commit: <span class="mono">${esc(previewCommit(st.pattern, first, first.features.length === 1 ? first.features[0] : ""))}</span>` : "No commit: the changes stay in your working tree for you to review.";
  };
  prev();
  bar.querySelectorAll("[data-step]").forEach((cb) => cb.addEventListener("change", () => { cb.checked ? st.steps.add(cb.dataset.step) : st.steps.delete(cb.dataset.step); prev(); }));
  const f = document.getElementById("wbf");
  f.pattern.addEventListener("input", () => { st.pattern = f.pattern.value; prev(); });
  f.account.addEventListener("change", () => { st.account = f.account.value; });
  f.model.addEventListener("change", () => { st.model = f.model.value; });
  f.effort.addEventListener("change", () => { st.effort = f.effort.value; });
  f.uiScope.addEventListener("change", () => { st.uiScope = f.uiScope.value; });
  f.notes.addEventListener("input", () => { st.batchNotes = f.notes.value; });
  document.getElementById("wbclear").addEventListener("click", () => { st.picked.clear(); renderTickets(true); });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!st.steps.size) return alert("Tick at least one step.");
    if (st.steps.has("commit") && !/\{key\}/.test(st.pattern)) return alert("The commit message needs {key}, so each commit names its ticket.");
    const steps = wb.allSteps.map((s) => s.id).filter((s) => st.steps.has(s));
    if (!confirm(`The agent will work on ${picked.length} ticket(s) in ${state.branchSeen || "this branch"}: ${steps.join(", ")}.${steps.includes("commit") ? " Each ticket gets its own local commit." : ""} Start?`)) return;
    const res = await post("/api/work", { tickets: picked.map((t) => ({ key: t.id, source: t.source, notes: st.notes[tkKey(t)] || undefined })), steps, commitPattern: st.pattern, account: st.account || undefined, model: st.model || undefined, effort: st.effort || undefined, notes: st.batchNotes || undefined, uiScope: st.uiScope || "ticket" });
    if (res.error) return alert(res.error);
    st.workRun = res.runId;
    st.picked.clear();
    await refreshJobs();
    renderTickets(true);
  });
}

const STEP_ICON = { passed: "✓", failed: "✗", error: "✗", blocked: "!", running: "…", queued: "·", skipped: "–", stopped: "■" };
const STEP_CLASS = { passed: "passed", failed: "failed", error: "failed", blocked: "warn", running: "running", queued: "none", skipped: "skipped", stopped: "stopped" };

/** A workbench run as a grid: a row per ticket, a cell per step. Follows it while it runs. */
async function showWork(runId, st) {
  const el = document.getElementById("workpanel");
  if (!el) return;
  const run = await api(`/api/work/${encodeURIComponent(runId)}`).catch(() => null);
  if (!run || run.error || run.kind !== "work") return;
  const done = run.status !== "running";
  el.innerHTML = `<div class="box"><div class="row" style="flex-wrap:wrap"><strong>Workbench run</strong>
      <span class="pill ${esc(run.status)}">${esc(run.status)}</span><span class="muted">started ${ago(run.startedAt)}${run.costUsd ? ` · $${run.costUsd.toFixed(2)}` : ""}</span><span style="flex:1"></span>
      ${done ? `<button class="btn secondary" id="wkclose">Close</button>` : `<button class="btn stop" id="wkstop">■ Stop</button>`}
      <a href="#runs/${encodeURIComponent(run.id)}">Full log</a></div>
    ${run.error ? `<p style="color:var(--warn)">${esc(run.error)}</p>` : ""}
    <table style="margin-top:8px"><thead><tr><th>Ticket</th>${run.steps.map((s) => `<th>${esc(STEP_NAMES[s] || s)}</th>`).join("")}<th>Result</th></tr></thead><tbody>
    ${run.tickets.map((t) => `<tr><td><span class="mono">${esc(t.key)}</span><br><span class="muted">${esc(t.title === t.key ? "" : t.title)}</span></td>
      ${run.steps.map((s) => { const x = t.steps.find((y) => y.step === s) || { status: "queued" }; return `<td title="${esc(x.note || x.status)}"><span class="pill ${STEP_CLASS[x.status] || "none"}">${STEP_ICON[x.status] || "·"}</span>${x.runId ? ` <a href="#runs/${encodeURIComponent(x.runId)}" class="muted" style="font-size:11px">run</a>` : ""}</td>`; }).join("")}
      <td>${t.commit ? `<span class="mono">${esc(t.commit.hash)}</span> ${esc(t.commit.message)}` : t.status === "needs-you" ? `<span class="pill warn">needs you</span> ${esc((t.steps.find((x) => ["failed", "blocked", "error"].includes(x.status)) || {}).note || "")}` : `<span class="pill ${esc(t.status)}">${esc(t.status)}</span>`}
      ${t.files.length ? `<details><summary class="muted">${t.files.length} file(s)</summary><div class="mono">${t.files.map(esc).join("<br>")}</div></details>` : ""}</td></tr>`).join("")}
    </tbody></table></div>`;
  document.getElementById("wkclose")?.addEventListener("click", () => { st.workRun = null; el.innerHTML = ""; });
  document.getElementById("wkstop")?.addEventListener("click", async () => { if (confirm("Stop the workbench run? The ticket in progress stops where it is.")) await stopRunReq(run.id); });
  if (!done && state.tab === "tickets") setTimeout(() => { if (state.tab === "tickets" && document.getElementById("workpanel") === el) showWork(runId, st); }, 2500);
  else if (done) refreshJobs();
}

const STEP_NAMES = { context: "Context", fix: "Change", unitwrite: "Write tests", unit: "Unit tests", ui: "UI test", validate: "Validate", commit: "Commit", comment: "Comment" };

/** The ticket on the right: its text, what Slack said about it, and testing it. */
function bindTicketDetail(sel, options, st, rerender) {
  const q = tkQuery(sel);
  const form = document.getElementById("tkf");
  const panel = document.getElementById("runpanel");
  const done = (run) => { state.showRun = run.id; render(); };
  bindTargetPicker(form, options, (v) => { st.against = v; });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const against = readTarget(form, options);
    if (against.error) return alert(against.error);
    const res = await post(`/api/inbox/${encodeURIComponent(sel.id)}/test${q}`, against);
    if (res.error) return alert(res.error);
    followRun(res.runId, panel, done);
  });
  document.getElementById("tkcards").addEventListener("click", async () => {
    const features = form.features ? form.features.value.split(",").map((x) => x.trim()).filter(Boolean) : [];
    const res = await post(`/api/inbox/${encodeURIComponent(sel.id)}/cards${q}`, { features });
    if (res.error) return alert(res.error);
    followRun(res.runId, panel, done);
  });
  document.getElementById("tkhide").addEventListener("click", async () => {
    await post("/api/workbench/hide", { key: sel.id, source: sel.source, hidden: sel.group !== "hidden" });
    st.selected = null;
    renderTickets();
  });
  const show = document.getElementById("tkshow");
  if (show) show.addEventListener("click", () => followRun(sel.lastRun.id, panel));
  const postBtn = document.getElementById("tkpost");
  if (postBtn) postBtn.addEventListener("click", async () => {
    const out = document.getElementById("tkpostpanel");
    const sep = q ? "&" : "?";
    const preview = await api(`/api/inbox/${encodeURIComponent(sel.id)}/comment${q}${sep}run=${encodeURIComponent(sel.lastRun.id)}`);
    if (preview.error) { out.innerHTML = `<p style="color:var(--fail)">${esc(preview.error)}</p>`; return; }
    out.innerHTML = `<div class="box" style="margin-top:10px"><h3>This comment goes on ${esc(sel.id)} in ${esc(sel.sourceLabel || "the tracker")}, under your name</h3><pre class="log" style="max-height:260px">${esc(preview.body)}</pre>
      <div class="row" style="margin-top:8px"><button class="btn" id="tkpostgo">Post comment</button><button class="btn secondary" id="tkpostno">Cancel</button><span id="tkpostout"></span></div></div>`;
    document.getElementById("tkpostno").addEventListener("click", () => { out.innerHTML = ""; });
    document.getElementById("tkpostgo").addEventListener("click", async (ev) => {
      ev.target.disabled = true;
      const res = await post(`/api/inbox/${encodeURIComponent(sel.id)}/comment${q}`, { run: sel.lastRun.id });
      document.getElementById("tkpostout").innerHTML = res.error ? `<span class="pill failed">not posted</span> ${esc(res.error)}` : `<span class="pill passed">posted</span>`;
      if (res.error) ev.target.disabled = false;
    });
  });
  const notes = document.getElementById("tknotes");
  notes.addEventListener("input", () => {
    const v = notes.value;
    if (v.trim()) st.notes[tkKey(sel)] = v; else delete st.notes[tkKey(sel)];
    saveNotes(st.notes);
  });
  // What people said about it in this project's Slack channels.
  const talk = document.getElementById("tktalk");
  api(`/api/inbox/${encodeURIComponent(sel.id)}/discussion${q}`).then((d) => {
    if (!talk || d.error) { if (talk) talk.innerHTML = `<span class="muted">${esc(d.error)}</span>`; return; }
    if (!d.searched.length && !d.errors.length) { talk.innerHTML = `<span class="muted">No Slack channel connected to this project. Add one in Settings → Connections.</span>`; return; }
    talk.innerHTML = `${d.matches.length ? d.matches.map((m) => `<div style="border-left:3px solid var(--line);padding:4px 10px;margin:6px 0">
        <div class="muted" style="font-size:12px">#${esc(m.channelName)} · ${esc(m.user)} · ${ago(m.at)}${m.replies ? ` · ${m.replies} replies` : ""} · <a href="${esc(m.link)}" target="_blank" rel="noopener">open in Slack</a></div>
        <div style="white-space:pre-wrap">${esc(m.text)}</div></div>`).join("") : `<span class="muted">Nothing about ${esc(sel.id)} in ${esc(d.searched.join(", "))}.</span>`}
      ${d.errors.map((e) => `<p style="color:var(--warn);margin:4px 0">${esc(e)}</p>`).join("")}`;
  });
}

async function renderAccounts(el) {
  const [accounts, login] = await Promise.all([api("/api/accounts"), api("/api/login")]);
  const mark = (ok) => ok ? `<span class="pill passed">stored</span>` : `<span class="muted">—</span>`;
  const l = login && login.run.login;
  const loginText = !l ? "Not checked yet." : l.state === "logged_in" ? (l.role ? `Logged in as <strong>${esc(l.role)}</strong>${l.seenAs ? ` (${esc(l.seenAs)})` : ""}` : `<strong style="color:var(--fail)">Logged in with an account that is not a test account</strong>${l.seenAs ? ` (${esc(l.seenAs)})` : ""} — agents will not change anything`) : l.state === "logged_out" ? "Logged out" : "Unknown";
  el.innerHTML = `
    <div class="box"><h3>Who the app on the device is logged in as</h3>
      <div class="row" style="flex-wrap:wrap">${loginText} ${login ? `<span class="muted">· ${esc(login.run.device)} · ${ago(login.at)}</span>` : ""}<span style="flex:1"></span>
        <button class="btn secondary" id="logincheck" data-job="${esc(jobKey.login())}" data-busy="Checking…" title="An agent opens the app on the emulator and reports who is logged in">Check login</button></div>
      <div id="runpanel"></div></div>`;
  el.innerHTML += `
    <div class="box"><h3>Test accounts</h3>
    <p class="muted" style="margin-top:0">Accounts agents may log in with. Roles and usernames are shared with the team in <span class="mono">probe/hints/accounts.yaml</span>; passwords and login codes are encrypted on this machine only, and agents never see them — Probe types them on the device.</p>
    ${accounts.length ? `<table><thead><tr><th>Role</th><th>Username</th><th>Shown as</th><th>Notes</th><th>Password</th><th>Login code</th><th></th></tr></thead><tbody>
      ${accounts.map((a) => `<tr><td class="mono">${esc(a.role)}</td><td>${esc(a.username)}</td><td>${esc(a.shownAs)}</td><td class="muted">${esc(a.notes)}</td><td>${mark(a.hasPassword)}</td><td>${mark(a.hasCode)}</td>
        <td style="white-space:nowrap"><button class="btn secondary" data-login="${esc(a.role)}" data-job="${esc(jobKey.login(a.role))}" data-busy="Logging in…" ${a.hasPassword ? "" : "disabled"} title="An agent logs the app on the emulator in with this account">Log in on device</button> <button class="btn secondary" data-edit="${esc(a.role)}">Edit</button> <button class="btn secondary" data-del="${esc(a.role)}">Remove</button></td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">No test accounts yet. Without one, a card that needs login ends as blocked.</div>`}
    <form class="acct" autocomplete="off">
      <label>Role<input name="role" placeholder="user_a" required pattern="[\\w-]{1,40}"></label>
      <label>Username<input name="username" placeholder="tester.a@example.com" required></label>
      <label>Shown as<input name="shownAs" placeholder="@tester_a or Tester A" title="The name or handle the app shows when logged in, so agents recognise the account"></label>
      <label>Notes<input name="notes" placeholder="main tester, has posts"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" placeholder="unchanged if empty"></label>
      <label>Login code<input name="code" type="password" autocomplete="off" placeholder="only if fixed"></label>
      <button class="btn" type="submit">Save account</button>
    </form></div>`;
  const startLogin = async (role, b) => {
    b.disabled = true;
    const res = await post("/api/login", { role });
    if (res.error) { alert(res.error); b.disabled = false; return; }
    followRun(res.runId, el.querySelector("#runpanel"), () => renderAccounts(el));
  };
  el.querySelector("#logincheck").addEventListener("click", (e) => startLogin(undefined, e.target));
  el.querySelectorAll("button[data-login]").forEach((b) => b.addEventListener("click", () => startLogin(b.dataset.login, b)));
  const form = el.querySelector("form.acct");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(form));
    const res = await api("/api/accounts", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (res.error) return alert(res.error);
    renderAccounts(el);
  });
  el.querySelectorAll("button[data-edit]").forEach((b) => b.addEventListener("click", () => {
    const a = accounts.find((x) => x.role === b.dataset.edit);
    form.role.value = a.role; form.username.value = a.username; form.shownAs.value = a.shownAs || ""; form.notes.value = a.notes || "";
    form.password.focus();
  }));
  el.querySelectorAll("button[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm(`Remove ${b.dataset.del} and its stored password?`)) return;
    await api(`/api/accounts/${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" });
    renderAccounts(el);
  }));
}

function bindProject() {
  const f = document.getElementById("pf");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const num = (v) => (v === "" ? null : Number(v));
    const body = {
      verify: { base: f.base.value || null, cards: f.cards.value, maxCards: Number(f.maxCards.value) },
      tickets: { pattern: f.pattern.value.trim() || null, url: f.url.value.trim() || null, fileCommand: f.fileCommand.value.trim() || null },
    };
    // App, device and performance fields only exist on a project whose app runs on a device.
    if (f.package) {
      body.app = { package: f.package.value.trim() || null, installTask: f.installTask.value.trim() || null };
      body.devices = { avd: f.avd.value || null, allowReal: [...f.querySelectorAll("input[name=allowReal]:checked")].map((i) => i.value) };
      body.perf = { maxStartupMs: num(f.maxStartupMs.value), maxJankyPct: num(f.maxJankyPct.value), maxP90Ms: num(f.maxP90Ms.value), maxMemoryMb: num(f.maxMemoryMb.value) };
      for (const k of ["maxStartupMs", "maxJankyPct", "maxP90Ms"]) if (body.perf[k] === null) delete body.perf[k];
    }
    const res = await post("/api/project", body);
    document.getElementById("pout").innerHTML = res.error ? `<span class="pill failed">not saved</span> ${esc(res.error)}` : `<span class="pill passed">saved</span>`;
    if (!res.error) setTimeout(renderSettings, 700);
  });
}

function connDetail(c) {
  if (c.kind === "jira") return `${esc(c.filter || "tickets that aren't done")}${c.email ? ` · ${esc(c.email)}` : ""}`;
  if (c.kind === "linear") return `${c.team ? `team ${esc(c.team)} · ` : ""}${esc(c.filter || "started and to-do tickets")}`;
  const ch = c.channels || [];
  return ch.length ? ch.map((x) => `#${esc(x.name)}${x.post ? " (posts)" : ""}`).join(", ") + ` · last ${c.days} days` : "no channel yet";
}

function renderConnections(pane, data) {
  const st = state.connEdit || (state.connEdit = { open: null, kind: null });
  pane.innerHTML = `<div class="box"><div class="row" style="flex-wrap:wrap"><div style="flex:1"><h3 style="margin:0">Connections for ${esc(data.project.name)}</h3>
      <div class="muted">What each tool is and where it points is saved to <span class="mono">probe/probe.yaml</span> for the team. Your tokens are encrypted on this machine, for this project only.</div></div>
      <select id="cnadd"><option value="">＋ Add connection…</option><option value="jira">Jira</option><option value="linear">Linear</option><option value="slack">Slack</option></select></div></div>
    ${st.open === "new" ? `<div class="box" style="border-color:var(--accent)">${connForm({ kind: st.kind, channels: [], days: 30 }, true)}</div>` : ""}
    ${CONN_GROUPS.map(([g, title, hint]) => {
      const list = data.connections.filter((c) => c.group === g);
      return `<div class="box"><h3>${title}</h3><p class="muted" style="margin-top:0">${hint}</p>
        ${list.length ? list.map((c) => `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">
          <div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><strong>${esc(c.label)}</strong>${c.legacy ? ` <span class="muted" style="font-size:12px">(from the older single-tracker setting)</span>` : ""}<div class="muted" style="font-size:12px">${connDetail(c)}</div></div>
            ${connStatus(c)}
            <button class="btn secondary" data-cn-test="${c.id}">Test</button>
            <button class="btn secondary" data-cn-edit="${c.id}">${st.open === c.id ? "Close" : "Edit"}</button>
            ${c.hasToken ? `<button class="btn secondary" data-cn-forget="${c.id}" title="Forget your token on this machine; the team setting stays">Forget token</button>` : ""}
            <button class="btn secondary" data-cn-remove="${c.id}" title="Remove it from the project for everyone">Remove</button></div>
          ${c.missing ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(c.missing)}</div>` : ""}
          <div data-cn-out="${c.id}" style="font-size:13px;margin-top:4px"></div>
          ${st.open === c.id ? `<div style="margin-top:10px">${connForm(c, false)}</div>` : ""}</div>`).join("")
        : `<div class="muted">None yet.</div>`}</div>`;
    }).join("")}`;

  document.getElementById("cnadd").addEventListener("change", (e) => { if (!e.target.value) return; Object.assign(st, { open: "new", kind: e.target.value }); renderConnections(pane, data); });
  pane.querySelectorAll("[data-cn-edit]").forEach((b) => b.addEventListener("click", () => { st.open = st.open === b.dataset.cnEdit ? null : b.dataset.cnEdit; renderConnections(pane, data); }));
  pane.querySelectorAll("[data-cn-test]").forEach((b) => b.addEventListener("click", async () => {
    const out = pane.querySelector(`[data-cn-out="${b.dataset.cnTest}"]`);
    out.innerHTML = `<span class="muted">Asking…</span>`;
    const r = await post(`/api/connections/${b.dataset.cnTest}/test`);
    out.innerHTML = r.ok ? `<span class="pill passed">works</span> as <strong>${esc(r.message)}</strong>` : `<span class="pill failed">not connected</span> ${esc(r.message)}`;
  }));
  pane.querySelectorAll("[data-cn-forget]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Forget your token for this connection on this machine?")) return;
    const r = await post(`/api/connections/${b.dataset.cnForget}/disconnect`);
    state.tickets = null; renderConnections(pane, r);
  }));
  pane.querySelectorAll("[data-cn-remove]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Remove this connection from the project? It is removed from probe/probe.yaml for the whole team, and your token is forgotten.")) return;
    const r = await api(`/api/connections/${b.dataset.cnRemove}`, { method: "DELETE" });
    state.tickets = null; st.open = null; renderConnections(pane, r);
  }));
  const form = pane.querySelector("form[data-conn]");
  if (form) bindConnForm(form, pane, data);
}

function connForm(c, isNew) {
  const k = c.kind;
  const tokenLabel = k === "slack" ? "Slack token (xoxb- bot or xoxp- user)" : k === "jira" ? "API token" : "API key";
  const help = k === "jira" ? "A Jira API token: id.atlassian.com → Security → API tokens." : k === "linear" ? "A Linear API key: Linear → Settings → Security & access → Personal API keys." : "A Slack app token with channels:history, groups:history, channels:read, groups:read and users:read (and chat:write to post). Invite the bot to each channel.";
  return `<form class="inline" data-conn="${esc(c.id || "")}" data-kind="${k}" autocomplete="off">
    <label>Name <span class="src">optional</span><input name="label" value="${esc(c.customLabel || "")}" placeholder="${k === "slack" ? "Acme Slack" : k === "jira" ? "Acme Jira" : "Linear"}" style="width:160px"></label>
    ${k === "jira" ? `<label>Site<input name="site" value="${esc(c.site || "")}" placeholder="https://acme.atlassian.net" style="width:240px"></label>
      <label>Account email <span class="src">this machine</span><input name="email" value="${esc(c.email || "")}" placeholder="you@example.com" style="width:200px"></label>
      <label>Build field<input name="buildField" value="${esc(c.buildField || "")}" placeholder="Fix version" style="width:130px"></label>
      <label style="flex:1 1 100%">Tickets to list (JQL)<input name="filter" class="mono" value="${esc(c.filter || "")}" placeholder='project = SHOP AND statusCategory != Done ORDER BY updated DESC'></label>` : ""}
    ${k === "linear" ? `<label>Team key<input name="team" value="${esc(c.team || "")}" placeholder="ENG" style="width:90px"></label>
      <label style="flex:1 1 320px">Statuses to list (comma separated)<input name="filter" value="${esc(c.filter || "")}" placeholder="Todo, In Progress, Ready for dev"></label>` : ""}
    ${k === "slack" ? `<label>Workspace<input name="workspace" value="${esc(c.workspace || "")}" placeholder="acme" style="width:140px"></label>
      <label>Look back (days)<input name="days" type="number" min="1" max="365" value="${esc(c.days || 30)}" style="width:90px"></label>` : ""}
    <label>${tokenLabel} <span class="src">${c.hasToken ? "stored on this machine" : "not stored yet"}</span><input name="token" type="password" autocomplete="new-password" placeholder="${c.hasToken ? "unchanged if empty" : "paste it here"}" style="width:220px"></label>
    ${k === "slack" ? `<div style="flex:1 1 100%">${isNew ? `<p class="muted" style="margin:0">Save the token first; then add the channels this project uses.</p>` : channelEditor(c)}</div>` : ""}
    <button class="btn" type="submit">${isNew ? "Add and test" : "Save and test"}</button>
    ${isNew ? `<button class="btn secondary" type="button" data-cancel>Cancel</button>` : ""}
    <p class="muted" style="flex:1 1 100%;margin:0">${help}</p>
    <p data-form-out style="flex:1 1 100%;margin:0"></p>
  </form>`;
}

function channelEditor(c) {
  const rows = (c.channels || []).map((ch, i) => `<tr data-ch="${i}"><td class="mono">#${esc(ch.name)}<br><span class="muted">${esc(ch.id)}</span></td>
    <td><input type="checkbox" data-f="search" ${ch.search ? "checked" : ""}></td>
    <td><input type="checkbox" data-f="post" ${ch.post ? "checked" : ""}></td>
    <td><input data-f="labels" value="${esc((ch.labels || []).join(", "))}" placeholder="any ticket" style="width:160px"></td>
    <td><button class="btn secondary" type="button" data-ch-del="${i}">Remove</button></td></tr>`).join("");
  return `<div style="font-weight:600;font-size:12px;color:var(--muted);margin-bottom:4px">Channels</div>
    <table><thead><tr><th>Channel</th><th title="Read it for talk about a ticket">Search</th><th title="Probe may post results here when you press Post">Post</th><th title="Only for tickets with one of these labels">Only for labels</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="muted">No channel yet.</td></tr>`}</tbody></table>
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn secondary" type="button" data-ch-load>＋ Add channels…</button><span data-ch-pick></span></div>`;
}

function readChannels(form, c) {
  return (c.channels || []).map((ch, i) => {
    const row = form.querySelector(`tr[data-ch="${i}"]`);
    if (!row) return null;
    return { ...ch, search: row.querySelector('[data-f="search"]').checked, post: row.querySelector('[data-f="post"]').checked, labels: row.querySelector('[data-f="labels"]').value.split(",").map((x) => x.trim()).filter(Boolean) };
  }).filter(Boolean);
}

function bindConnForm(form, pane, data) {
  const id = form.dataset.conn;
  const c = data.connections.find((x) => x.id === id) || { kind: form.dataset.kind, channels: [] };
  const out = form.querySelector("[data-form-out]");
  form.querySelector("[data-cancel]")?.addEventListener("click", () => { state.connEdit.open = null; renderConnections(pane, data); });
  form.querySelectorAll("[data-ch-del]").forEach((b) => b.addEventListener("click", () => { b.closest("tr").remove(); }));
  form.querySelector("[data-ch-load]")?.addEventListener("click", async (e) => {
    const spot = form.querySelector("[data-ch-pick]");
    spot.innerHTML = `<span class="muted">Asking Slack for channels…</span>`;
    const r = await api(`/api/connections/${id}/channels`);
    if (r.error) { spot.innerHTML = `<span class="pill failed">no list</span> ${esc(r.error)}`; return; }
    const have = new Set((c.channels || []).map((x) => x.id));
    const options = r.channels.filter((x) => !have.has(x.id));
    spot.innerHTML = `<input type="search" placeholder="Filter channels…" data-ch-q style="min-width:180px">
      <div data-ch-list style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:6px;min-width:280px">${options.map((x) => `<label style="display:flex;gap:6px;align-items:center;font-weight:400;color:var(--text)"><input type="checkbox" value="${esc(x.id)}" data-name="${esc(x.name)}"> #${esc(x.name)} ${x.isPrivate ? `<span class="muted">private</span>` : ""} ${x.isMember ? "" : `<span class="muted" title="Invite the bot to read it">bot not in it</span>`}</label>`).join("") || `<span class="muted">Every channel the token sees is added.</span>`}</div>
      <button class="btn secondary" type="button" data-ch-addsel style="margin-top:6px">Add selected</button>`;
    spot.querySelector("[data-ch-q]").addEventListener("input", (ev) => { const v = ev.target.value.toLowerCase(); spot.querySelectorAll("[data-ch-list] label").forEach((l) => { l.style.display = l.textContent.toLowerCase().includes(v) ? "" : "none"; }); });
    spot.querySelector("[data-ch-addsel]").addEventListener("click", async () => {
      const add = [...spot.querySelectorAll("[data-ch-list] input:checked")].map((i) => ({ id: i.value, name: i.dataset.name, search: true, post: false, labels: [] }));
      if (!add.length) return;
      const res = await post("/api/connections", { id, channels: [...readChannels(form, c), ...add] });
      if (res.error) { spot.innerHTML = `<span class="pill failed">not saved</span> ${esc(res.error)}`; return; }
      renderConnections(pane, res);
    });
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = (n) => (form[n] ? form[n].value : undefined);
    const body = { id: id || undefined, kind: c.kind, label: v("label"), site: v("site"), email: v("email"), filter: v("filter"), team: v("team"), buildField: v("buildField"), workspace: v("workspace"), days: form.days ? Number(form.days.value) : undefined, token: v("token") };
    if (c.kind === "slack" && id) body.channels = readChannels(form, c);
    const res = await post("/api/connections", body);
    if (res.error) { out.innerHTML = `<span class="pill failed">not saved</span> ${esc(res.error)}`; return; }
    state.tickets = null;
    state.connEdit.open = res.saved;
    renderConnections(pane, res);
    const t = await post(`/api/connections/${res.saved}/test`);
    const o = pane.querySelector(`[data-cn-out="${res.saved}"]`);
    if (o) o.innerHTML = t.ok ? `<span class="pill passed">works</span> as <strong>${esc(t.message)}</strong>` : `<span class="pill failed">saved, not connected</span> ${esc(t.message)}`;
  });
}

// ── AI accounts and which one (and which model) each kind of work uses ──

const AI_MODE = { default: "The CLI's own login", profile: "A separate login folder", apiKey: "An API key" };

function renderAi(pane, data) {
  const ai = data.ai;
  const editing = state.aiEdit;
  const acct = editing && editing !== "new" ? ai.accounts.find((a) => a.id === editing) : null;
  const modelOpts = (cur) => `<option value="" ${cur ? "" : "selected"}>Agents default (${esc(ai.model || "CLI default")})</option>` +
    ai.models.filter(([m]) => m).map(([m, label]) => `<option value="${esc(m)}" ${m === cur ? "selected" : ""}>${esc(label)}</option>`).join("") +
    (cur && !ai.models.some(([m]) => m === cur) ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : "") + `<option value="__other">Other model name…</option>`;
  pane.innerHTML = `<div class="box"><h3>AI accounts for ${esc(data.project.name)}</h3>
      <p class="muted" style="margin-top:0">The ${esc(ai.runner)} accounts this project's agents may use on this machine. Each one is a separate login, so a client project can run on the client's account and never touch your own. Keys are encrypted on this machine.</p>
      ${ai.accounts.length ? `<table><thead><tr><th>Account</th><th>Signs in with</th><th></th></tr></thead><tbody>${ai.accounts.map((a) => `<tr>
        <td><strong>${esc(a.name)}</strong> <span class="muted mono">${esc(a.id)}</span></td>
        <td>${AI_MODE[a.mode]}${a.mode === "profile" ? ` <span class="mono muted">${esc(a.profileDir)}</span>` : ""}${a.mode === "apiKey" ? (a.hasKey ? ` <span class="pill passed">key stored</span>` : ` <span class="pill warn">no key</span>`) : ""}</td>
        <td style="white-space:nowrap"><button class="btn secondary" data-ai-test="${a.id}">Test</button> <button class="btn secondary" data-ai-edit="${a.id}">Edit</button> <button class="btn secondary" data-ai-del="${a.id}">Remove</button><div data-ai-out="${a.id}" style="font-size:12px"></div></td></tr>`).join("")}</tbody></table>`
        : `<p class="muted">No account added: agents use ${esc(ai.runner)}'s own login on this machine.</p>`}
      <div style="margin-top:10px">${editing ? aiAccountForm(acct) : `<button class="btn secondary" id="aiadd">＋ Add an account</button>`}</div></div>
    <div class="box"><h3>Which account and model for each kind of work</h3>
      <p class="muted" style="margin-top:0">For example: coding on Opus 5.5 at high effort with your work account, reviews on Sonnet at medium. Effort is how long the model thinks: low is fastest and cheapest, max is the most thorough. A workbench run can still pick another for that run.</p>
      <form class="inline" id="aiuse">${ai.roles.map((r) => { const u = ai.use[r.id] || {}; return `<div style="flex:1 1 100%;display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:6px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1 1 220px"><strong>${esc(r.label.split(":")[0])}</strong><div class="muted" style="font-size:12px">${esc(r.label.split(":")[1] || "")}</div></div>
        <label>Account<select name="acct-${r.id}"><option value="">${ai.accounts.length ? `First account (${esc(ai.accounts[0].name)})` : "CLI's own login"}</option>${ai.accounts.map((a) => `<option value="${a.id}" ${u.account === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
        <label>Model<select name="model-${r.id}">${modelOpts(u.model)}</select></label>
        <label>Effort<select name="effort-${r.id}"><option value="">CLI default</option>${ai.efforts.map((e) => `<option ${u.effort === e ? "selected" : ""}>${e}</option>`).join("")}</select></label></div>`; }).join("")}
        <button class="btn" type="submit">Save</button><span id="aiuseout"></span></form>
      <p class="muted" style="margin-bottom:0">Runner and the default model are under General → Agents.</p></div>`;
  document.getElementById("aiadd")?.addEventListener("click", () => { state.aiEdit = "new"; renderAi(pane, data); });
  pane.querySelectorAll("[data-ai-edit]").forEach((b) => b.addEventListener("click", () => { state.aiEdit = b.dataset.aiEdit; renderAi(pane, data); }));
  pane.querySelectorAll("[data-ai-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Remove this account from the project on this machine? Its key is forgotten.")) return;
    renderAi(pane, await api(`/api/ai/accounts/${b.dataset.aiDel}`, { method: "DELETE" }));
  }));
  pane.querySelectorAll("[data-ai-test]").forEach((b) => b.addEventListener("click", async () => {
    const out = pane.querySelector(`[data-ai-out="${b.dataset.aiTest}"]`);
    out.innerHTML = `<span class="muted">Sending one tiny prompt…</span>`;
    const r = await post(`/api/ai/accounts/${b.dataset.aiTest}/test`, {});
    out.innerHTML = r.ok ? `<span class="pill passed">works</span> ${esc(r.model)}` : `<span class="pill failed">not usable</span> ${esc(r.message)}`;
  }));
  pane.querySelectorAll("#aiuse select[name^=model-]").forEach((s) => s.addEventListener("change", () => {
    if (s.value !== "__other") return;
    const name = (prompt("Model name, e.g. claude-opus-5-5 or opus:") || "").trim();
    if (!name) { s.value = ""; return; }
    s.insertAdjacentHTML("beforeend", `<option value="${esc(name)}">${esc(name)}</option>`); s.value = name;
  }));
  document.getElementById("aiuse").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const use = Object.fromEntries(ai.roles.map((r) => [r.id, { account: f[`acct-${r.id}`].value, model: f[`model-${r.id}`].value === "__other" ? "" : f[`model-${r.id}`].value, effort: f[`effort-${r.id}`].value }]));
    const res = await post("/api/ai/use", use);
    if (res.error) { document.getElementById("aiuseout").innerHTML = `<span class="pill failed">not saved</span> ${esc(res.error)}`; return; }
    renderAi(pane, res);
    document.getElementById("aiuseout").innerHTML = `<span class="pill passed">saved</span>`;
  });
  const form = document.getElementById("aif");
  if (form) {
    const sync = () => form.querySelectorAll("[data-mode]").forEach((el) => { el.style.display = el.dataset.mode === form.mode.value ? "" : "none"; });
    form.mode.addEventListener("change", sync); sync();
    form.querySelector("[data-cancel]").addEventListener("click", () => { state.aiEdit = null; renderAi(pane, data); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await post("/api/ai/accounts", { id: acct ? acct.id : undefined, name: form.name.value, mode: form.mode.value, profileDir: form.profileDir.value, apiKey: form.apiKey.value });
      if (res.error) { document.getElementById("aifout").innerHTML = `<span class="pill failed">not saved</span> ${esc(res.error)}`; return; }
      state.aiEdit = null; renderAi(pane, res);
    });
  }
}

function aiAccountForm(a) {

  return `<form class="inline" id="aif" autocomplete="off">
    <label>Name<input name="name" value="${esc(a.name)}" placeholder="Work Claude (Max)" style="width:200px"></label>
    <label>Signs in with<select name="mode">${Object.entries(AI_MODE).map(([k, l]) => `<option value="${k}" ${a.mode === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
