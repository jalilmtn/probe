  const [s, p, br] = await Promise.all([api("/api/settings"), api("/api/project"), api("/api/branch?branches")]);
  p.branches = br.branches;
  const current = s.agents.model;
  const known = MODELS.some(([m]) => m === current);
  $view.innerHTML = projectBox(p) + `<div id="acctwrap"></div>` + `
    <div class="box"><h3>Agent model</h3>
      <p class="muted" style="margin-top:0">Every Probe agent (drafting cards, device runs, verify, writing tests) runs on your own Claude Code login and plan, with this model. It is saved for this machine only, since each developer's plan differs; a run started from the CLI can still pass <span class="mono">--model</span>.</p>
      <form class="inline" id="sf">
        <label>Model<select name="pick">${MODELS.map(([m, label]) => `<option value="${m}" ${m === current ? "selected" : ""}>${esc(label)}</option>`).join("")}<option value="custom" ${known ? "" : "selected"}>Other…</option></select></label>
        <label id="customwrap" style="${known ? "display:none" : ""}">Model name<input name="custom" value="${known ? "" : esc(current)}" placeholder="claude-sonnet-5-5"></label>
        <button class="btn" type="submit">Save</button>
        <button class="btn secondary" type="button" id="stest" title="Sends one tiny prompt with this model to check your plan can run it">Test on my plan</button>
        ${s.agents.source === "machine" ? `<button class="btn secondary" type="button" id="sreset">Use team default</button>` : ""}
      </form>
      <p style="margin-bottom:0">In use: <strong class="mono">${esc(current)}</strong> <span class="muted">· ${SOURCE_LABEL[s.agents.source]}</span></p>
      <p id="sout" style="margin-bottom:0"></p>
    </div>`;
  bindProject();
  renderAccounts(document.getElementById("acctwrap"));
  const form = document.getElementById("sf");
  const chosen = () => (form.pick.value === "custom" ? form.custom.value.trim() : form.pick.value);
  form.pick.addEventListener("change", () => { document.getElementById("customwrap").style.display = form.pick.value === "custom" ? "" : "none"; });
  const out = document.getElementById("sout");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await post("/api/settings", { model: chosen() });
    if (res.error) return alert(res.error);
    renderSettings();
  });
  document.getElementById("stest").addEventListener("click", async (e) => {
    e.target.disabled = true; out.innerHTML = `<span class="muted">Asking ${esc(chosen())}…</span>`;
    const r = await post("/api/settings/test", { model: chosen() });
    e.target.disabled = false;
    out.innerHTML = r.ok
      ? `<span class="pill passed">works</span> <span class="mono">${esc(r.model)}</span> answered on your plan.`
      : `<span class="pill failed">not usable</span> <span class="mono">${esc(r.model)}</span>: ${esc(r.message)}`;
  });
  const reset = document.getElementById("sreset");
  if (reset) reset.addEventListener("click", async () => { await post("/api/settings", { model: "" }); renderSettings(); });
}

async function renderDoctor(el) {
  el.innerHTML = `<div class="empty">Checking the machine…</div>`;
  const checks = await api("/api/doctor");
  el.innerHTML = `<h2>System checks</h2><table><thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead><tbody>
    ${checks.map((c) => `<tr><td><strong>${esc(c.label)}</strong></td><td><span class="pill ${c.status}">${c.status}</span></td><td>${esc(c.detail)}${c.fix ? `<br><span class="muted">→ ${esc(c.fix)}</span>` : ""}</td></tr>`).join("")}
  </tbody></table>`;
}

const STATUS_ICON = { ok: "✓", warn: "!", fail: "✕" };
const INIT_PILL = { done: ["ok", "✓"], todo: ["none", "·"], waiting: ["warn", "…"], warn: ["warn", "!"] };
const INIT_RUNNABLE = new Set(["config", "kit", "scan", "manifests", "cards", "agentfile"]);

/** `probe init` as a checklist: each step, the features to choose, and the drafts to review. */
async function renderInit(el) {
  const k = await api("/api/init");
  const open = k.steps.filter((s) => s.status === "todo" || s.status === "waiting");
  const features = k.steps.find((s) => s.id === "features");
  el.innerHTML = `<div class="box"><div class="row" style="flex-wrap:wrap"><h3 style="margin:0">${open.length ? `Feature knowledge: ${open.length} step${open.length === 1 ? "" : "s"} left` : "Feature knowledge: set up"}</h3><div style="flex:1"></div>
      ${open.some((s) => s.status === "todo") ? `<button class="btn" id="initrun" ${k.running ? "disabled" : ""}>${k.running ? "Running…" : "▶ Run the next steps"}</button>` : ""}</div>
    <p class="muted" style="margin:6px 0 0">The same steps as <code class="mono">probe init</code>. Each reads where the project stands, so running it again carries on and never redoes finished work. Manifests, card links and the agent file arrive below as drafts: nothing lands until you apply it, and nothing is committed.</p>
    <ul class="setup">${k.steps.map((s) => `<li><span class="pill ${INIT_PILL[s.status][0]}">${INIT_PILL[s.status][1]}</span>
      <div class="what"><strong>${esc(s.label)}</strong><div class="muted">${esc(s.detail)}</div></div>
      ${s.status === "todo" && INIT_RUNNABLE.has(s.id) && !k.running ? `<button class="btn secondary" data-initstep="${s.id}">Run</button>` : ""}</li>`).join("")}</ul>
    ${features.status === "waiting" && k.proposed.length ? `<div class="k" style="margin-top:10px">Features to give a manifest (${k.proposed.length} proposed by the scan)</div>
      <div class="row" style="flex-wrap:wrap;gap:4px 14px;margin:6px 0">${k.proposed.map((f) => `<label style="font-size:13px"><input type="checkbox" data-feat="${esc(f)}" checked> ${esc(f)}</label>`).join("")}</div>
      <div class="row"><button class="btn" id="initchoose">Use these features</button><button class="btn secondary" id="initnone">Untick all</button></div>` : ""}
  </div>
  <div id="initpanel"></div>
  ${k.drafts.map((d) => `<div class="box stale"><h3>${d.step === "agentfile" ? "Agent file" : d.step === "cards" ? `Cards for ${esc(d.feature)}` : `Manifest for ${esc(d.feature)}`} <span class="muted" style="font-weight:400">· drafted ${ago(d.createdAt)}</span></h3>
      <p style="margin:4px 0 8px;white-space:pre-wrap">${esc(d.summary)}</p>
      ${d.diffs.map((x) => `<div class="mono muted">${esc(x.path)}${x.conflict ? ` <span class="pill fail">changed since the draft was made</span>` : ""}</div>${diffHtml(x.diff)}`).join("")}
      <div class="row"><button class="btn" data-iapprove="${esc(d.id)}" ${d.diffs.some((x) => x.conflict) ? "disabled" : ""}>Apply</button><button class="btn secondary" data-ireject="${esc(d.id)}">Reject</button></div></div>`).join("")}`;

  const start = async (body) => {
    const res = await post("/api/init/run", body);
    if (res.error) return alert(res.error);
    el.querySelectorAll("#initrun,[data-initstep]").forEach((b) => (b.disabled = true));
    followRun(res.runId, document.getElementById("initpanel"), () => renderInit(el));
  };
  el.querySelector("#initrun")?.addEventListener("click", () => start({}));
  el.querySelectorAll("[data-initstep]").forEach((b) => b.addEventListener("click", () => start({ step: b.dataset.initstep })));
  el.querySelector("#initnone")?.addEventListener("click", () => el.querySelectorAll("[data-feat]").forEach((c) => (c.checked = false)));
  el.querySelector("#initchoose")?.addEventListener("click", async () => {
    const chosen = [...el.querySelectorAll("[data-feat]")].filter((c) => c.checked).map((c) => c.dataset.feat);
    if (!chosen.length) return alert("Tick at least one feature.");
    const res = await post("/api/init/features", { features: chosen });
    if (res.error) return alert(res.error);
    renderInit(el);
  });
  el.querySelectorAll("[data-iapprove],[data-ireject]").forEach((b) => b.addEventListener("click", async () => {
    const approve = !!b.dataset.iapprove;
    const id = b.dataset.iapprove || b.dataset.ireject;
    if (approve && !confirm("Write this draft into the project? Nothing is committed.")) return;
    b.disabled = true;
    const res = await post(`/api/drafts/${encodeURIComponent(id)}/${approve ? "approve" : "reject"}`, {});
    if (!res.ok) alert(res.error);
    renderInit(el);
  }));
  if (k.running) followRun(k.running, document.getElementById("initpanel"), () => renderInit(el));
}

async function renderSetup() {
  $view.innerHTML = `<div class="empty">Checking this project…</div>`;
  const items = await api("/api/setup");
  const left = items.filter((i) => i.status !== "ok").length;
  $view.innerHTML = `<div id="initwrap"></div><div class="box"><h3>${left ? `Device testing: ${left} thing${left === 1 ? "" : "s"} left to set up` : "Device testing: ready"}</h3>
    <p class="muted" style="margin-top:0">Probe finds what it can on its own; anything it guessed is marked and can be changed in Settings. Nothing here needs a file edited by hand.</p>
    <ul class="setup">${items.map((i) => `<li><span class="pill ${i.status}">${STATUS_ICON[i.status]}</span>
      <div class="what"><strong>${esc(i.label)}</strong><div class="muted">${esc(i.detail)}</div></div>
      ${i.action && i.status !== "ok" ? `<button class="btn secondary" data-go="${i.action.tab}">${esc(i.action.label)}</button>` : ""}</li>`).join("")}</ul></div>`;
  $view.insertAdjacentHTML("beforeend", `<div id="docwrap"></div>`);
  $view.querySelectorAll("button[data-go]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.go; render(); }));
  renderDoctor(document.getElementById("docwrap"));
  renderInit(document.getElementById("initwrap"));
}

(async () => {
  await checkBranch();
  // A project that cannot be tested yet opens on what is missing.
  const [items, init] = await Promise.all([api("/api/setup").catch(() => []), api("/api/init").catch(() => null)]);
  const knowledgeOpen = init && init.steps.some((s) => ["features", "manifests"].includes(s.id) && s.status !== "done");
  if (items.some((i) => i.status === "fail") || knowledgeOpen) state.tab = "setup";
  render();
})();
</script>
</body>
